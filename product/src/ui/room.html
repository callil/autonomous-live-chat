<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tinker Tank — live room</title>
<meta name="ahp-fallback" content="/fallback">
<meta name="ahp-version" content="__DEPLOY_SHA__">
<link rel="stylesheet" href="/assets/room.css">
<script>
/* The product error boundary (task 13): if the room bundle fails to load or
   never finishes booting, fall back to the platform's frozen minimal UI. */
(function () {
  var fallbackMeta = document.querySelector('meta[name=ahp-fallback]');
  var target = fallbackMeta ? fallbackMeta.content : '/fallback';
  function bail() { if (!window.__ahpBooted) location.replace(target); }
  window.addEventListener('error', function (event) {
    var el = event.target;
    if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) bail();
  }, true);
  setTimeout(bail, 8000);

  /* Compare the revision that rendered this document with the currently
     deployed revision. The user chooses when to reload, so drafts are safe. */
  window.addEventListener('DOMContentLoaded', function () {
    var versionMeta = document.querySelector('meta[name=ahp-version]');
    var loadedSha = versionMeta && versionMeta.content;
    var notice = document.getElementById('app-update');
    var button = document.getElementById('app-update-button');
    if (!/^[0-9a-f]{40}$/.test(loadedSha || '') || !notice || !button) return;
    async function checkVersion() {
      try {
        var response = await fetch('/version', { cache: 'no-store' });
        if (!response.ok) return;
        var current = await response.json();
        if (/^[0-9a-f]{40}$/.test(current.sha || '') && current.sha !== loadedSha) notice.hidden = false;
      } catch (_) { /* Connection state already reports outages. */ }
    }
    button.addEventListener('click', function () { location.reload(); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) checkVersion(); });
    window.addEventListener('focus', checkVersion);
    checkVersion();
    setInterval(checkVersion, 60000);
  });
})();
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="room-heading">
      <span class="room-title">The Tinker Tank</span>
      <span class="room-meta" id="concurrent-users" aria-live="polite">0 users</span>
    </span>
    <span class="topbar-status">
      <span class="app-update" id="app-update" role="status" hidden>
        <span>A newer version is ready.</span>
        <button id="app-update-button" type="button">Update</button>
      </span>
      <span class="connection"><i class="dot" id="dot"></i><span id="connection">Connecting</span></span>
    </span>
  </header>
  <main class="columns">
    <section class="conversation" aria-live="polite">
      <div class="room-intro">
        <h1>Ask for a change.</h1>
        <p>Chat with the room, or use Target, Comment, and Draw to request a change — the agent builds it, CI verifies it, and the feed tells the truth about every step.</p>
      </div>
      <div class="messages" id="messages"></div>
    </section>
  </main>
  <form class="composer" id="composer">
    <textarea id="chat-input" rows="1" placeholder="Message the room" aria-label="Message"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send message">Send</button>
  </form>
</div>
<div class="join-scrim" id="join" hidden>
  <form class="join-card" id="join-form">
    <h2>Join the room</h2>
    <label for="join-name">Display name</label>
    <input id="join-name" maxlength="64" autocomplete="nickname" placeholder="Ada">
    <button type="submit" class="primary">Join</button>
    <p class="request-error" id="join-error" role="alert"></p>
  </form>
</div>
<script src="/assets/room.client.js" defer></script>
<!--
  THE APP HARNESS OVERLAY. Served by the frozen platform, not by this app:
  the authoring tools (Target/Comment/Draw), the build queue, the activity
  feed, and its provenance links all live inside a closed shadow root that
  this page cannot style, script, or break. This one tag is the entire
  integration surface — the same tag `npx app-harness init` adds to any app.
-->
<script src="/overlay.js" defer data-room="main" data-anchor-mode="data-loc" data-repo-url="https://github.com/callil/autonomous-live-chat"></script>
</body>
</html>
