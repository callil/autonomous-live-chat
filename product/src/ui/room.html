<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tinker Tank — live room</title>
<meta name="ahp-fallback" content="/fallback">
<meta name="ahp-version" content="__DEPLOY_SHA__">
<link rel="stylesheet" href="/assets/room.css">
<style>
.message { position: relative; }
.message:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.message-reactions { position: absolute; z-index: 2; left: .5rem; bottom: -.8rem; display: flex; gap: .15rem; padding: .25rem; border: 1px solid var(--line); border-radius: 999px; background: var(--panel, white); box-shadow: 0 .25rem 1rem rgba(0, 0, 0, .16); opacity: 0; visibility: hidden; transform: translateY(.25rem) scale(.96); transition: opacity .12s ease, transform .12s ease, visibility .12s; }
.message-reactions[data-open="true"] { opacity: 1; visibility: visible; transform: none; }
.message-reaction { min-width: 2rem; padding: .22rem .38rem; border: 0; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-size: 1.15rem; line-height: 1.35; cursor: pointer; transition: background .12s ease, transform .12s ease; }
.message-reaction:hover, .message-reaction:focus-visible { background: var(--soft); transform: scale(1.15); }
.message-reaction[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.message-my-reaction { display: inline-flex; align-items: center; margin-left: .3rem; padding: .05rem .35rem; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, transparent); font-size: 1rem; line-height: 1.25; }
.message-my-reaction[hidden] { display: none; }
</style>
<script>
/* The product error boundary (task 13): if the room bundle fails to load or
   never finishes booting, fall back to the platform's frozen minimal UI. */
(function () {
  var fallbackMeta = document.querySelector('meta[name=ahp-fallback]');
  var target = fallbackMeta ? fallbackMeta.content : '/fallback';
  function bail() { if (!window.__ahpBooted) location.replace(target); }
  window.addEventListener('error', function (event) {
    var el = event.target;
    if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) bail();
  }, true);
  setTimeout(bail, 8000);

  /* Compare the revision that rendered this document with the currently
     deployed revision. The user chooses when to reload, so drafts are safe. */
  window.addEventListener('DOMContentLoaded', function () {
    var versionMeta = document.querySelector('meta[name=ahp-version]');
    var loadedSha = versionMeta && versionMeta.content;
    var notice = document.getElementById('app-update');
    var button = document.getElementById('app-update-button');
    if (!/^[0-9a-f]{40}$/.test(loadedSha || '') || !notice || !button) return;
    function announce(sha) {
      if (/^[0-9a-f]{40}$/.test(sha || '') && sha !== loadedSha) notice.hidden = false;
    }
    async function checkVersion() {
      try {
        var response = await fetch('/version', { cache: 'no-store' });
        if (!response.ok) return;
        var current = await response.json();
        announce(current.sha);
      } catch (_) { /* Connection state already reports outages. */ }
    }
    button.addEventListener('click', function () { location.reload(); });
    document.addEventListener('ahp:deploy-observed', function (event) { announce(event && event.detail && event.detail.sha); });
    document.addEventListener('ahp:version-recheck', checkVersion);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) checkVersion(); });
    window.addEventListener('focus', checkVersion);
    checkVersion();
  });
})();
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="room-heading"><span class="room-title">self driving chat</span></span>
    <span class="topbar-status">
      <span class="app-update" id="app-update" role="status" hidden><span>A newer version is ready.</span><button id="app-update-button" type="button">Update</button></span>
      <span class="connection"><i class="dot" id="dot"></i><span id="connection">Connecting</span></span>
      <span class="room-meta" id="concurrent-users" aria-live="polite">0 users</span>
      <button class="account-button" id="account-button" type="button" aria-label="Open account settings" title="Account settings" hidden><span id="account-initials">G</span><img id="account-avatar" alt=""></button>
    </span>
  </header>
  <main class="columns"><section class="conversation" aria-live="polite" data-persist-messages="true"><div class="messages" id="messages"></div></section></main>
  <form class="composer" id="composer" style="border-top: 1px solid rgba(255, 255, 255, 0.12);">
    <label class="image-upload-button" for="image-upload" title="Upload image" aria-label="Upload image">＋</label>
    <input id="image-upload" class="visually-hidden" type="file" accept="image/*" aria-label="Upload image">
    <textarea id="chat-input" rows="1" placeholder="Message the room" aria-label="Message"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send message">Send</button>
  </form>
</div>
<aside class="room-intro" id="room-intro" role="status"><div><h1>Ask for a change</h1><p>Chat with the room, or use <strong>Target</strong>, <strong>Comment</strong>, and <strong>Draw</strong> to request a change — the agent builds it, CI verifies it, and the feed tells the truth about every step.</p></div><button class="toast-dismiss" id="room-intro-dismiss" type="button" aria-label="Dismiss introduction">×</button></aside>
<script>
(function () {
  var dismissalKey = 'ahp:room-intro-dismissed:v1';
  var intro = document.getElementById('room-intro');
  var dismiss = document.getElementById('room-intro-dismiss');
  try { intro.hidden = localStorage.getItem(dismissalKey) === 'true'; } catch (_) {}
  dismiss.addEventListener('click', function () { try { localStorage.setItem(dismissalKey, 'true'); } catch (_) {} });
})();
</script>
<div class="join-scrim" id="join" hidden>
  <form class="join-card" id="join-form">
    <h2 id="join-title">Join the room</h2>
    <div class="profile-photo-field">
      <span class="profile-photo-preview"><span id="profile-initials">G</span><img id="profile-avatar" alt="Profile photo preview"></span>
      <div><label class="secondary profile-photo-button" for="profile-upload">Upload PFP</label><input id="profile-upload" class="visually-hidden" type="file" accept="image/*"><button class="remove-photo" id="profile-remove" type="button" hidden>Remove photo</button></div>
    </div>
    <label for="join-name">Display name</label>
    <input id="join-name" maxlength="64" autocomplete="nickname" placeholder="Ada">
    <div class="account-actions"><button type="button" class="secondary" id="account-cancel" hidden>Cancel</button><button type="submit" class="primary" id="account-save">Join</button></div>
    <p class="request-error" id="join-error" role="alert"></p>
  </form>
</div>
<script src="/assets/room.client.js" defer></script>
<script>
(function () {
  var messages = document.getElementById('messages');
  var reactions = [['👍', 'Like'], ['❤️', 'Love'], ['😂', 'Laugh']];
  function closeReactions(except) {
    messages.querySelectorAll('.message-reactions[data-open="true"]').forEach(function (bar) {
      if (bar !== except) bar.setAttribute('data-open', 'false');
    });
  }
  function addReactions(message) {
    if (message.querySelector('.message-reactions')) return;
    var body = message.querySelector('.message-body');
    if (!body) return;
    message.tabIndex = 0;
    message.setAttribute('aria-label', 'Message. Press Enter to react.');
    var meta = body.querySelector('.message-meta');
    var selected = document.createElement('span');
    selected.className = 'message-my-reaction';
    selected.setAttribute('aria-label', 'Your reaction');
    selected.hidden = true;
    (meta || body).appendChild(selected);
    var bar = document.createElement('div');
    bar.className = 'message-reactions';
    bar.setAttribute('aria-label', 'Reactions');
    bar.setAttribute('data-open', 'false');
    reactions.forEach(function (reaction) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'message-reaction';
      button.textContent = reaction[0];
      button.setAttribute('aria-label', reaction[1]);
      button.setAttribute('aria-pressed', 'false');
      button.addEventListener('click', function (event) {
        event.stopPropagation();
        var removing = button.getAttribute('aria-pressed') === 'true';
        bar.querySelectorAll('.message-reaction').forEach(function (other) { other.setAttribute('aria-pressed', 'false'); });
        button.setAttribute('aria-pressed', removing ? 'false' : 'true');
        selected.textContent = removing ? '' : reaction[0];
        selected.hidden = removing;
        bar.setAttribute('data-open', 'false');
      });
      bar.appendChild(button);
    });
    function openPicker(event) {
      event.preventDefault();
      event.stopPropagation();
      var opening = bar.getAttribute('data-open') !== 'true';
      closeReactions(opening ? bar : null);
      bar.setAttribute('data-open', opening ? 'true' : 'false');
      if (opening) bar.querySelector('button').focus();
    }
    message.addEventListener('contextmenu', openPicker);
    message.addEventListener('dblclick', openPicker);
    message.addEventListener('keydown', function (event) {
      if ((event.key === 'Enter' || event.key === ' ') && event.target === message) openPicker(event);
    });
    body.appendChild(bar);
  }
  document.addEventListener('click', function () { closeReactions(); });
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape') closeReactions(); });
  new MutationObserver(function (records) {
    records.forEach(function (record) {
      record.addedNodes.forEach(function (node) {
        if (node.nodeType === 1 && node.matches('.message')) addReactions(node);
      });
    });
  }).observe(messages, { childList: true });
  messages.querySelectorAll('.message').forEach(addReactions);
})();
</script>
<script src="/overlay.js" defer data-room="main" data-anchor-mode="data-loc" data-repo-url="https://github.com/callil/autonomous-live-chat"></script>
</body>
</html>
