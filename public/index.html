<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Livework</title>
    <style>
      :root { --accent: #10a37f; color: #0d0d0d; background: #fff; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #fff; }
      button, textarea { font: inherit; }
      .app { min-height: 100vh; display: grid; grid-template-columns: 52px minmax(0, 1fr); }
      .sidebar { border-right: 1px solid #ececec; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .rail-button { width: 38px; height: 38px; border: 0; border-radius: 8px; background: transparent; color: #202123; cursor: pointer; display: grid; place-items: center; font-size: 20px; line-height: 1; }
      .rail-button:hover, .rail-button[aria-current="page"] { background: #f1f1f1; }
      .brand { font-size: 15px; font-weight: 750; letter-spacing: -.06em; }
      .request-button { font-size: 20px; }
      main { min-width: 0; display: flex; flex-direction: column; }
      .topbar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
      .room-title { font-size: 14px; font-weight: 600; }
      .connection { color: #868686; font-size: 11px; display: flex; gap: 6px; align-items: center; }
      .dot, .status-dot { width: 7px; height: 7px; background: #999; border-radius: 999px; display: inline-block; }
      .dot.live { background: var(--accent); }
      .conversation { width: min(100%, 768px); margin: 0 auto; padding: 38px 24px 158px; flex: 1; }
      .empty { color: #777; font-size: 14px; margin-top: 29vh; text-align: center; }
      .messages { display: grid; gap: 24px; }
      .message { max-width: 680px; }
      .author { color: #555; font-size: 12px; font-weight: 600; margin: 0 0 5px; }
      .text { font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
      .workflow-status { border: 1px solid #e5e5e5; border-radius: 10px; margin: 0 0 28px; color: #4b4b4b; font-size: 12px; }
      .workflow-status summary { min-height: 38px; padding: 0 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; list-style: none; }
      .workflow-status summary::-webkit-details-marker { display: none; }
      .workflow-status summary::after { content: "⌄"; color: #999; font-size: 14px; margin-left: auto; }
      .workflow-status[open] summary { border-bottom: 1px solid #ededed; }
      .workflow-status[open] summary::after { transform: rotate(180deg); }
      .status-dot.running { background: #d97706; animation: pulse 1.4s ease-in-out infinite; }
      .status-dot.completed { background: var(--accent); }
      .status-dot.review, .status-dot.rejected, .status-dot.failed { background: #c2410c; }
      .workflow-body { padding: 12px; }
      .workflow-request { margin: 0 0 10px; color: #222; font-size: 13px; line-height: 1.45; }
      .activity { display: grid; gap: 7px; list-style: none; margin: 0; padding: 0; }
      .activity li { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px; line-height: 1.4; }
      .activity strong { color: #777; font-size: 11px; font-weight: 600; text-transform: capitalize; }
      .workflow-result { border-top: 1px solid #eee; color: #333; line-height: 1.45; margin: 11px 0 0; padding-top: 10px; }
      .composer-wrap { position: fixed; bottom: 0; left: 52px; right: 0; background: linear-gradient(to top, #fff 74%, rgba(255,255,255,0)); padding: 28px 24px 20px; }
      .composer { width: min(100%, 768px); margin: 0 auto; border: 1px solid #d8d8d8; border-radius: 14px; box-shadow: 0 3px 14px rgba(0,0,0,.07); background: #fff; padding: 9px 10px; display: flex; align-items: end; gap: 8px; }
      textarea { border: 0; outline: 0; resize: none; min-height: 25px; max-height: 180px; flex: 1; padding: 5px 4px; color: #171717; font-size: 15px; line-height: 1.45; background: transparent; }
      textarea::placeholder { color: #8e8e8e; }
      .send { border: 0; width: 32px; height: 32px; border-radius: 8px; background: #202123; color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 16px; }
      .send:disabled { background: #e5e5e5; color: #aaa; cursor: default; }
      .hint { width: min(100%, 768px); margin: 8px auto 0; text-align: center; color: #999; font-size: 11px; }
      .request-dialog { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.18); }
      .request-dialog[hidden], .workflow-status[hidden] { display: none; }
      .request-card { width: min(100%, 440px); background: #fff; border: 1px solid #dedede; border-radius: 14px; box-shadow: 0 16px 48px rgba(0,0,0,.18); padding: 18px; }
      .request-card h2 { font-size: 15px; margin: 0 0 7px; }
      .request-card p { color: #666; font-size: 12px; line-height: 1.45; margin: 0 0 12px; }
      .request-input { border: 1px solid #d9d9d9; border-radius: 9px; display: block; min-height: 92px; padding: 9px; width: 100%; }
      .dialog-actions { display: flex; justify-content: end; gap: 8px; margin-top: 12px; }
      .secondary, .primary { border: 0; border-radius: 8px; cursor: pointer; font-size: 13px; padding: 8px 11px; }
      .secondary { background: #f2f2f2; color: #333; }
      .primary { background: #202123; color: #fff; }
      .request-error { color: #b42318; font-size: 12px; margin: 8px 0 0; min-height: 17px; }
      @keyframes pulse { 50% { opacity: .35; } }
      @media (max-width: 720px) { .app { grid-template-columns: 44px minmax(0, 1fr); } .sidebar { padding: 7px 3px; } .rail-button { width: 36px; height: 36px; } .composer-wrap { left: 44px; padding: 24px 14px 14px; } .conversation { padding: 28px 18px 138px; } .topbar { padding: 0 18px; } }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Workspace navigation">
        <div class="rail-button brand" aria-label="Livework">L</div>
        <button class="rail-button request-button" id="open-request" type="button" aria-label="Request a change" title="Request a change">✦</button>
        <button class="rail-button" type="button" aria-label="Main room" aria-current="page" title="Main room">#</button>
      </aside>
      <main>
        <header class="topbar"><span class="room-title">Main room</span><span class="connection"><i class="dot" id="dot"></i><span id="connection">Connecting</span></span></header>
        <section class="conversation" aria-live="polite">
          <details class="workflow-status" id="workflow-status" hidden>
            <summary><i class="status-dot" id="workflow-dot"></i><span id="workflow-summary">Change request</span></summary>
            <div class="workflow-body"><p class="workflow-request" id="workflow-request"></p><ul class="activity" id="workflow-activity"></ul><p class="workflow-result" id="workflow-result" hidden></p></div>
          </details>
          <div class="empty" id="empty">Start the conversation.</div><div class="messages" id="messages"></div>
        </section>
      </main>
    </div>
    <form class="composer-wrap" id="form">
      <div class="composer"><textarea id="input" aria-label="Message" rows="1" maxlength="2000" placeholder="Message Main room" autofocus></textarea><button class="send" id="send" type="submit" aria-label="Send message" disabled>↑</button></div>
      <div class="hint">Messages are shared live with everyone in this room.</div>
    </form>
    <div class="request-dialog" id="request-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="request-title">
      <form class="request-card" id="request-form"><h2 id="request-title">Request a change</h2><p>Allowed requests are limited to small visual or copy changes. Everything else is held for review.</p><textarea class="request-input" id="request-input" aria-label="Change request" maxlength="500" placeholder="For example: set the accent to blue"></textarea><div class="dialog-actions"><button class="secondary" id="cancel-request" type="button">Cancel</button><button class="primary" type="submit">Start</button></div><p class="request-error" id="request-error" role="alert"></p></form>
    </div>
    <script>
      const messagesEl = document.querySelector('#messages'); const emptyEl = document.querySelector('#empty'); const input = document.querySelector('#input'); const send = document.querySelector('#send'); const form = document.querySelector('#form'); const dot = document.querySelector('#dot'); const connection = document.querySelector('#connection');
      const workflowEl = document.querySelector('#workflow-status'); const workflowDot = document.querySelector('#workflow-dot'); const workflowSummary = document.querySelector('#workflow-summary'); const workflowRequest = document.querySelector('#workflow-request'); const workflowActivity = document.querySelector('#workflow-activity'); const workflowResult = document.querySelector('#workflow-result'); const requestDialog = document.querySelector('#request-dialog'); const requestForm = document.querySelector('#request-form'); const requestInput = document.querySelector('#request-input'); const requestError = document.querySelector('#request-error');
      const author = localStorage.getItem('livework-author') || `Guest ${Math.floor(100 + Math.random() * 900)}`; localStorage.setItem('livework-author', author);
      const phaseNames = { received: 'Received', interpreting: 'Interpreting', preparing_candidate: 'Preparing candidate', validating: 'Validating', deploying: 'Deploying', completed: 'Completed', requires_review: 'Needs review', rejected: 'Rejected', failed: 'Failed' };
      let socket; let reconnectTimer; const rendered = new Set();
      function setConnection(text, live) { connection.textContent = text; dot.classList.toggle('live', live); }
      function render(message) { if (rendered.has(message.id)) return; rendered.add(message.id); emptyEl.hidden = true; const row = document.createElement('article'); row.className = 'message'; const name = document.createElement('div'); name.className = 'author'; name.textContent = message.author; const text = document.createElement('div'); text.className = 'text'; text.textContent = message.text; row.append(name, text); messagesEl.append(row); row.scrollIntoView({ behavior: 'smooth', block: 'end' }); }
      function renderWorkflow(workflow) { if (!workflow) { workflowEl.hidden = true; return; } workflowEl.hidden = false; const terminal = ['completed', 'requires_review', 'rejected', 'failed'].includes(workflow.phase); workflowSummary.textContent = `Change request · ${phaseNames[workflow.phase] || workflow.phase}`; workflowDot.className = `status-dot ${workflow.phase === 'completed' ? 'completed' : workflow.phase === 'requires_review' ? 'review' : workflow.phase === 'rejected' ? 'rejected' : workflow.phase === 'failed' ? 'failed' : 'running'}`; workflowRequest.textContent = workflow.request; workflowActivity.replaceChildren(); workflow.activity.forEach(item => { const li = document.createElement('li'); const phase = document.createElement('strong'); phase.textContent = phaseNames[item.phase] || item.phase; const message = document.createElement('span'); message.textContent = item.message; li.append(phase, message); workflowActivity.append(li); }); workflowResult.hidden = !workflow.result; workflowResult.textContent = workflow.result || ''; if (!terminal) workflowEl.open = true; }
      function connect() { clearTimeout(reconnectTimer); const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'; socket = new WebSocket(`${protocol}//${location.host}/api/rooms/main`); socket.addEventListener('open', () => { setConnection('Live', true); resize(); }); socket.addEventListener('close', () => { setConnection('Reconnecting', false); resize(); reconnectTimer = setTimeout(connect, 1000); }); socket.addEventListener('error', () => socket.close()); socket.addEventListener('message', ({ data }) => { try { const event = JSON.parse(data); if (event.type === 'chat:snapshot') event.messages.forEach(render); if (event.type === 'chat:message') render(event.message); if (event.type === 'chat:presence') setConnection(`${event.count} live`, true); if (event.type === 'workflow:snapshot' || event.type === 'workflow:update') renderWorkflow(event.workflow); if (event.type === 'workflow:notice') { requestError.textContent = event.message; requestDialog.hidden = false; } } catch {} }); }
      function resize() { input.style.height = 'auto'; input.style.height = `${Math.min(input.scrollHeight, 180)}px`; send.disabled = !input.value.trim() || socket?.readyState !== WebSocket.OPEN; }
      function openRequest() { requestError.textContent = ''; requestDialog.hidden = false; requestInput.focus(); }
      function closeRequest() { requestDialog.hidden = true; }
      input.addEventListener('input', resize); input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } }); document.querySelector('#open-request').addEventListener('click', openRequest); document.querySelector('#cancel-request').addEventListener('click', closeRequest);
      form.addEventListener('submit', event => { event.preventDefault(); const text = input.value.trim(); if (!text || socket?.readyState !== WebSocket.OPEN) return; socket.send(JSON.stringify({ type: 'chat:send', author, text })); input.value = ''; resize(); });
      requestForm.addEventListener('submit', event => { event.preventDefault(); const request = requestInput.value.trim(); if (!request) { requestError.textContent = 'Describe the change you want to make.'; return; } if (socket?.readyState !== WebSocket.OPEN) { requestError.textContent = 'Connection is not ready yet.'; return; } socket.send(JSON.stringify({ type: 'workflow:request', request })); requestInput.value = ''; closeRequest(); });
      requestDialog.addEventListener('click', event => { if (event.target === requestDialog) closeRequest(); }); connect(); resize();
    </script>
  </body>
</html>
