<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>App Harness</title>
    <style>
      :root { --accent: #ea580c; color: #0d0d0d; background: #fff; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #fff; }
      button, textarea { font: inherit; }
      .app { min-height: 100vh; display: grid; grid-template-columns: 52px minmax(0, 1fr); }
      .sidebar { border-right: 1px solid #ececec; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .rail-button { width: 38px; height: 38px; border: 0; border-radius: 8px; background: transparent; color: #202123; cursor: pointer; display: grid; place-items: center; font-size: 20px; line-height: 1; }
      .rail-button:hover, .rail-button[aria-current="page"], .rail-button[aria-pressed="true"] { background: #f1f1f1; }
      .brand { font-size: 15px; font-weight: 750; letter-spacing: -.06em; }
      .request-button { font-size: 20px; }
      main { min-width: 0; display: flex; flex-direction: column; }
      .topbar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
      .room-title { font-size: 14px; font-weight: 600; }
      .connection { color: #868686; font-size: 11px; display: flex; gap: 6px; align-items: center; }
      .dot, .status-dot { width: 7px; height: 7px; background: #999; border-radius: 999px; display: inline-block; }
      .dot.live { background: var(--accent); }
      .conversation { width: min(100%, 768px); margin: 0 auto; padding: 38px 24px 194px; flex: 1; }
      .empty { color: #777; font-size: 14px; margin-top: 29vh; text-align: center; }
      .messages { display: grid; gap: 24px; }
      .message { max-width: 680px; }
      .author { color: #555; font-size: 12px; font-weight: 600; margin: 0 0 5px; }
      .text { font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
      .workflow-status { border: 1px solid #e5e5e5; border-radius: 10px; margin: 0 0 28px; color: #4b4b4b; font-size: 12px; }
      .workflow-status summary { min-height: 38px; padding: 0 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; list-style: none; }
      .workflow-status summary::-webkit-details-marker { display: none; }
      .workflow-status summary::after { content: "⌄"; color: #999; font-size: 14px; margin-left: auto; }
      .workflow-status[open] summary { border-bottom: 1px solid #ededed; }
      .workflow-status[open] summary::after { transform: rotate(180deg); }
      .status-dot.running { background: #d97706; animation: pulse 1.4s ease-in-out infinite; }
      .status-dot.completed { background: var(--accent); }
      .status-dot.review, .status-dot.rejected, .status-dot.failed { background: #c2410c; }
      .workflow-body { padding: 12px; }
      .workflow-request { margin: 0 0 10px; color: #222; font-size: 13px; line-height: 1.45; }
      .activity { display: grid; gap: 7px; list-style: none; margin: 0; padding: 0; }
      .activity li { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px; line-height: 1.4; }
      .activity strong { color: #777; font-size: 11px; font-weight: 600; text-transform: capitalize; }
      .workflow-result { border-top: 1px solid #eee; color: #333; line-height: 1.45; margin: 11px 0 0; padding-top: 10px; }
      .composer-wrap { position: fixed; bottom: 36px; left: 52px; right: 0; background: linear-gradient(to top, #fff 74%, rgba(255,255,255,0)); padding: 28px 24px 20px; }
      .composer { width: min(100%, 768px); margin: 0 auto; border: 1px solid #d8d8d8; border-radius: 14px; box-shadow: 0 3px 14px rgba(0,0,0,.07); background: #fff; padding: 9px 10px; display: flex; align-items: end; gap: 8px; }
      textarea { border: 0; outline: 0; resize: none; min-height: 25px; max-height: 180px; flex: 1; padding: 5px 4px; color: #171717; font-size: 15px; line-height: 1.45; background: transparent; }
      textarea::placeholder { color: #8e8e8e; }
      .send { border: 0; width: 32px; height: 32px; border-radius: 8px; background: #202123; color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 16px; }
      .send:disabled { background: #e5e5e5; color: #aaa; cursor: default; }
      .hint { width: min(100%, 768px); margin: 8px auto 0; text-align: center; color: #999; font-size: 11px; }
      .request-dialog { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.18); }
      .request-dialog[hidden], .workflow-status[hidden] { display: none; }
      .request-card { width: min(100%, 440px); background: #fff; border: 1px solid #dedede; border-radius: 14px; box-shadow: 0 16px 48px rgba(0,0,0,.18); padding: 18px; }
      .request-card h2 { font-size: 15px; margin: 0 0 7px; }
      .request-card p { color: #666; font-size: 12px; line-height: 1.45; margin: 0 0 12px; }
      .request-input { border: 1px solid #d9d9d9; border-radius: 9px; display: block; min-height: 92px; padding: 9px; width: 100%; }
      .dialog-actions { display: flex; justify-content: end; gap: 8px; margin-top: 12px; }
      .secondary, .primary { border: 0; border-radius: 8px; cursor: pointer; font-size: 13px; padding: 8px 11px; }
      .secondary { background: #f2f2f2; color: #333; }
      .primary { background: #202123; color: #fff; }
      .request-error { color: #b42318; font-size: 12px; margin: 8px 0 0; min-height: 17px; }
      .harness-frame { inset: 0; pointer-events: none; position: fixed; z-index: 10; }
      .harness-rail, .target-composer, .comment-pin { pointer-events: auto; }
      .harness-rail { align-items: center; background: rgba(255,255,255,.96); border-top: 1px solid #e5e5e5; bottom: 0; color: #4b4b4b; display: flex; font-size: 11px; gap: 4px; height: 36px; left: 52px; padding: 0 12px; position: fixed; right: 0; z-index: 4; }
      .harness-mark { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: -.04em; margin-right: 3px; }
      .harness-tool { align-items: center; background: transparent; border: 0; border-radius: 6px; color: #303030; cursor: pointer; display: inline-flex; font-size: 13px; gap: 5px; height: 28px; justify-content: center; padding: 0 7px; }
      .harness-tool:hover, .harness-tool[aria-pressed="true"] { background: #eeeeee; }
      .harness-tool[aria-pressed="true"] { color: #111; box-shadow: inset 0 -1px 0 var(--accent); }
      .harness-tool svg { height: 15px; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; width: 15px; }
      .harness-tool:not(.target-tool) { font-size: 14px; padding: 0; width: 28px; }
      .harness-state { color: #777; margin-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .annotation-count { color: #999; margin-left: auto; }
      .harness-rail .workflow-status { background: rgba(255,255,255,.98); bottom: 44px; box-shadow: 0 7px 22px rgba(0,0,0,.12); margin: 0; max-width: min(420px, calc(100vw - 24px)); position: fixed; right: 12px; width: 420px; }
      .workflow-status > summary.rail-summary { display: none; }
      .drawing-layer { height: 100%; inset: 0; pointer-events: none; position: fixed; width: 100%; z-index: 1; }
      .draw-mode-active .drawing-layer { cursor: crosshair; pointer-events: auto; }
      .drawing-path { fill: none; pointer-events: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; }
      .comment-layer { inset: 0; pointer-events: none; position: fixed; z-index: 2; }
      .comment-pin { align-items: center; background: #202123; border: 2px solid #fff; border-radius: 999px; box-shadow: 0 2px 7px rgba(0,0,0,.22); color: #fff; cursor: default; display: flex; font-size: 10px; height: 18px; justify-content: center; position: fixed; transform: translate(-50%, -50%); width: 18px; }
      .target-mode-active [data-target-id] { cursor: crosshair; }
      .comment-mode-active [data-target-id] { cursor: crosshair; }
      .target-hovered { outline: 1px solid var(--accent); outline-offset: 3px; box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 11%, transparent); animation: target-shimmer 1.15s ease-in-out infinite; }
      .target-selected { outline: 2px solid var(--accent); outline-offset: 3px; box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 14%, transparent); }
      .target-composer { animation: composer-rise .16s ease-out; position: fixed; z-index: 5; width: min(360px, calc(100vw - 24px)); padding: 12px; border: 1px solid #d7d7d7; border-radius: 12px; background: #fff; box-shadow: 0 12px 34px rgba(0,0,0,.15); }
      .target-composer[hidden] { display: none; }
      .target-context { color: #666; display: block; font-size: 12px; line-height: 1.4; margin: 0 0 9px; }
      .target-composer .request-input { min-height: 74px; }
      @keyframes target-shimmer { 50% { outline-offset: 5px; box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 4%, transparent); } }
      @keyframes composer-rise { from { opacity: .2; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .target-hovered, .target-composer { animation: none; } }
      @media (max-width: 720px) { .app { grid-template-columns: 44px minmax(0, 1fr); } .sidebar { padding: 7px 3px; } .rail-button { width: 36px; height: 36px; } .composer-wrap { bottom: 36px; left: 44px; padding: 24px 14px 14px; } .conversation { padding: 28px 18px 174px; } .topbar { padding: 0 18px; } .target-composer { width: min(360px, calc(100vw - 16px)); } .harness-rail { left: 44px; padding: 0 7px; } .harness-mark { display: none; } .harness-state { margin-left: 2px; } .harness-rail .workflow-status { bottom: 42px; right: 6px; width: min(420px, calc(100vw - 12px)); } }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Workspace navigation">
        <div class="rail-button brand" data-target-id="brand" data-target-label="App Harness brand" aria-label="App Harness">A</div>
        <button class="rail-button request-button" id="open-request" data-target-id="rail-request-change" data-target-label="Request a change" type="button" aria-label="Request a change" title="Request a change">✦</button>
        <button class="rail-button" data-target-id="rail-main-room" data-target-label="Main room control" type="button" aria-label="Main room" aria-current="page" title="Main room">#</button>
      </aside>
      <main>
        <header class="topbar" data-target-id="room-header" data-target-label="Main room header"><span class="room-title" data-target-id="room-title" data-target-text>Main room</span><span class="connection" data-target-id="connection-status" data-target-label="Connection status"><i class="dot" id="dot"></i><span id="connection">Connecting</span></span></header>
        <section class="conversation" data-target-id="conversation" data-target-label="Conversation" aria-live="polite">
          <div class="empty" id="empty" data-target-id="empty-state" data-target-text>Start the conversation.</div><div class="messages" id="messages"></div>
        </section>
      </main>
    </div>
    <form class="composer-wrap" id="form" data-target-id="message-composer" data-target-label="Message composer">
      <div class="composer"><textarea id="input" data-target-id="message-input" data-target-label="Message input" aria-label="Message" rows="1" maxlength="2000" placeholder="Message Main room" autofocus></textarea><button class="send" id="send" data-target-id="send-message" data-target-label="Send message" type="submit" aria-label="Send message" disabled>↑</button></div>
      <div class="hint">Messages are shared live with everyone in this room.</div>
    </form>
    <div class="request-dialog" id="request-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="request-title">
      <form class="request-card" id="request-form"><h2 id="request-title">Request a change</h2><p>Allowed requests are limited to small visual or copy changes. Everything else is held for review.</p><textarea class="request-input" id="request-input" aria-label="Change request" maxlength="500" placeholder="For example: set the accent to blue"></textarea><div class="dialog-actions"><button class="secondary" id="cancel-request" type="button">Cancel</button><button class="primary" type="submit">Start</button></div><p class="request-error" id="request-error" role="alert"></p></form>
    </div>
    <div class="harness-frame" aria-label="App Harness overlay">
      <svg class="drawing-layer" id="drawing-layer" aria-label="Drawing feedback layer"></svg>
      <div class="comment-layer" id="comment-layer" aria-label="Comment markers"></div>
      <footer class="harness-rail" aria-label="App Harness instrument strip" aria-live="polite">
        <span class="harness-mark" aria-hidden="true">App Harness</span>
        <button class="harness-tool target-tool" id="target-mode" type="button" aria-label="Target an element for a change request" aria-pressed="false" title="Target an element">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M8 8l8 8M8 16l8-8"/><circle cx="12" cy="12" r="4"/></svg><span>Target</span>
        </button>
        <button class="harness-tool" id="comment-mode" type="button" aria-label="Add a comment" aria-pressed="false" title="Add a comment">●</button>
        <button class="harness-tool" id="draw-mode" type="button" aria-label="Draw feedback" aria-pressed="false" title="Draw feedback">╱</button>
        <span class="harness-state" id="harness-status-text">Ready</span><span class="annotation-count" id="annotation-count">0 marks</span>
        <button class="harness-tool" id="workflow-toggle" type="button" aria-label="Show change activity" title="Change activity" hidden>⌃</button>
        <details class="workflow-status" id="workflow-status" hidden>
          <summary class="rail-summary"><i class="status-dot" id="workflow-dot"></i><span id="workflow-summary">Change request</span></summary>
          <div class="workflow-body"><p class="workflow-request" id="workflow-request"></p><ul class="activity" id="workflow-activity"></ul><p class="workflow-result" id="workflow-result" hidden></p></div>
        </details>
      </footer>
    </div>
    <form class="target-composer" id="target-composer" hidden aria-label="Targeted change request">
      <span class="target-context" id="target-context"></span>
      <textarea class="request-input" id="target-request-input" aria-label="Targeted change request" maxlength="500" placeholder="Describe the change"></textarea>
      <div class="dialog-actions"><button class="secondary" id="cancel-target-request" type="button">Cancel</button><button class="primary" type="submit">Start</button></div><p class="request-error" id="target-request-error" role="alert"></p>
    </form>
    <script>
      const messagesEl = document.querySelector('#messages'); const emptyEl = document.querySelector('#empty'); const input = document.querySelector('#input'); const send = document.querySelector('#send'); const form = document.querySelector('#form'); const dot = document.querySelector('#dot'); const connection = document.querySelector('#connection');
      const workflowEl = document.querySelector('#workflow-status'); const workflowDot = document.querySelector('#workflow-dot'); const workflowSummary = document.querySelector('#workflow-summary'); const workflowRequest = document.querySelector('#workflow-request'); const workflowActivity = document.querySelector('#workflow-activity'); const workflowResult = document.querySelector('#workflow-result'); const workflowToggle = document.querySelector('#workflow-toggle'); const harnessStatusText = document.querySelector('#harness-status-text'); const annotationCount = document.querySelector('#annotation-count'); const requestDialog = document.querySelector('#request-dialog'); const requestForm = document.querySelector('#request-form'); const requestInput = document.querySelector('#request-input'); const requestError = document.querySelector('#request-error');
      const targetModeButton = document.querySelector('#target-mode'); const commentModeButton = document.querySelector('#comment-mode'); const drawModeButton = document.querySelector('#draw-mode'); const targetComposer = document.querySelector('#target-composer'); const targetContext = document.querySelector('#target-context'); const targetRequestInput = document.querySelector('#target-request-input'); const targetRequestError = document.querySelector('#target-request-error'); const drawingLayer = document.querySelector('#drawing-layer'); const commentLayer = document.querySelector('#comment-layer');
      const author = localStorage.getItem('app-harness-author') || `Guest ${Math.floor(100 + Math.random() * 900)}`; localStorage.setItem('app-harness-author', author);
      const phaseNames = { received: 'Received', interpreting: 'Interpreting', preparing_candidate: 'Preparing candidate', validating: 'Validating', deploying: 'Deploying', completed: 'Completed', requires_review: 'Needs review', rejected: 'Rejected', failed: 'Failed' };
      let socket; let reconnectTimer; let targetMode = false; let commentMode = false; let drawMode = false; let composerKind = 'request'; let hoveredTarget; let selectedTarget; let selectedEnvelope; let annotations = []; let drawing = false; let draftPoints = []; let draftPath; const rendered = new Set();
      function setConnection(text, live) { connection.textContent = text; dot.classList.toggle('live', live); }
      function render(message) { if (rendered.has(message.id)) return; rendered.add(message.id); emptyEl.hidden = true; const row = document.createElement('article'); row.className = 'message'; row.dataset.targetId = `message-${message.id}`; row.dataset.targetLabel = `Message from ${message.author}`; const name = document.createElement('div'); name.className = 'author'; name.textContent = message.author; const text = document.createElement('div'); text.className = 'text'; text.textContent = message.text; row.append(name, text); messagesEl.append(row); row.scrollIntoView({ behavior: 'smooth', block: 'end' }); }
      function targetName(target) { return target?.label || target?.text || target?.targetId?.replace(/[-_]+/g, ' ') || 'this element'; }
      function renderWorkflow(workflow) { if (!workflow) { workflowEl.hidden = true; workflowToggle.hidden = true; workflowEl.open = false; harnessStatusText.textContent = 'Ready'; return; } workflowEl.hidden = false; workflowToggle.hidden = false; const terminal = ['completed', 'requires_review', 'rejected', 'failed'].includes(workflow.phase); harnessStatusText.textContent = terminal ? phaseNames[workflow.phase] : 'Change in progress'; workflowSummary.textContent = `Change request · ${phaseNames[workflow.phase] || workflow.phase}`; workflowDot.className = `status-dot ${workflow.phase === 'completed' ? 'completed' : workflow.phase === 'requires_review' ? 'review' : workflow.phase === 'rejected' ? 'rejected' : workflow.phase === 'failed' ? 'failed' : 'running'}`; workflowRequest.textContent = workflow.target ? `${targetName(workflow.target)} — ${workflow.request}` : workflow.request; workflowActivity.replaceChildren(); workflow.activity.forEach(item => { const li = document.createElement('li'); const phase = document.createElement('strong'); phase.textContent = phaseNames[item.phase] || item.phase; const message = document.createElement('span'); message.textContent = item.message; li.append(phase, message); workflowActivity.append(li); }); workflowResult.hidden = !workflow.result; workflowResult.textContent = workflow.result || ''; }
      function drawPath(points) { return points.map((point, index) => `${index ? 'L' : 'M'}${point.x} ${point.y}`).join(' '); }
      function renderAnnotations(next) { annotations = next; drawingLayer.replaceChildren(); commentLayer.replaceChildren(); annotations.forEach(annotation => { if (annotation.kind === 'draw') { const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.setAttribute('class', 'drawing-path'); path.setAttribute('d', drawPath(annotation.points)); drawingLayer.append(path); return; } const pin = document.createElement('span'); pin.className = 'comment-pin'; pin.textContent = '•'; pin.title = `${targetName(annotation.target)}: ${annotation.text}`; pin.style.left = `${annotation.target.rect.x + annotation.target.rect.width}px`; pin.style.top = `${annotation.target.rect.y}px`; commentLayer.append(pin); }); annotationCount.textContent = `${annotations.length} ${annotations.length === 1 ? 'mark' : 'marks'}`; }
      function connect() { clearTimeout(reconnectTimer); const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'; socket = new WebSocket(`${protocol}//${location.host}/api/rooms/main`); socket.addEventListener('open', () => { setConnection('Live', true); resize(); }); socket.addEventListener('close', () => { setConnection('Reconnecting', false); resize(); reconnectTimer = setTimeout(connect, 1000); }); socket.addEventListener('error', () => socket.close()); socket.addEventListener('message', ({ data }) => { try { const event = JSON.parse(data); if (event.type === 'chat:snapshot') event.messages.forEach(render); if (event.type === 'chat:message') render(event.message); if (event.type === 'chat:presence') setConnection(`${event.count} live`, true); if (event.type === 'workflow:snapshot' || event.type === 'workflow:update') renderWorkflow(event.workflow); if (event.type === 'harness:annotations') renderAnnotations(event.annotations); if (event.type === 'workflow:notice') { requestError.textContent = event.message; requestDialog.hidden = false; } } catch {} }); }
      function resize() { input.style.height = 'auto'; input.style.height = `${Math.min(input.scrollHeight, 180)}px`; send.disabled = targetMode || commentMode || drawMode || !input.value.trim() || socket?.readyState !== WebSocket.OPEN; }
      function openRequest() { requestError.textContent = ''; requestDialog.hidden = false; requestInput.focus(); }
      function closeRequest() { requestDialog.hidden = true; }
      function clearTargetSelection() { hoveredTarget?.classList.remove('target-hovered'); selectedTarget?.classList.remove('target-selected'); hoveredTarget = undefined; selectedTarget = undefined; selectedEnvelope = undefined; }
      function closeTargetComposer() { targetComposer.hidden = true; targetRequestInput.value = ''; targetRequestError.textContent = ''; clearTargetSelection(); }
      function setTargetMode(active) { targetMode = active; document.body.classList.toggle('target-mode-active', active); targetModeButton.setAttribute('aria-pressed', String(active)); if (active) { setCommentMode(false); setDrawMode(false); closeTargetComposer(); } else hoveredTarget?.classList.remove('target-hovered'); resize(); }
      function setCommentMode(active) { commentMode = active; document.body.classList.toggle('comment-mode-active', active); commentModeButton.setAttribute('aria-pressed', String(active)); if (active) { setTargetMode(false); setDrawMode(false); closeTargetComposer(); } else hoveredTarget?.classList.remove('target-hovered'); resize(); }
      function setDrawMode(active) { drawMode = active; document.body.classList.toggle('draw-mode-active', active); drawModeButton.setAttribute('aria-pressed', String(active)); if (active) { setTargetMode(false); setCommentMode(false); closeTargetComposer(); } resize(); }
      function safeVisibleText(element) { return element.hasAttribute('data-target-text') ? element.textContent.trim().replace(/\s+/g, ' ').slice(0, 120) : undefined; }
      function envelopeFor(element) { const rect = element.getBoundingClientRect(); const targetId = element.dataset.targetId; const role = element.getAttribute('role') || (element.tagName === 'BUTTON' ? 'button' : element.tagName === 'TEXTAREA' ? 'textbox' : undefined); return { targetId, selector: `[data-target-id="${targetId}"]`, tag: element.tagName.toLowerCase(), role, label: element.dataset.targetLabel || element.getAttribute('aria-label') || undefined, text: safeVisibleText(element), page: location.pathname, room: 'main', rect: { x: Math.round(rect.x * 100) / 100, y: Math.round(rect.y * 100) / 100, width: Math.round(rect.width * 100) / 100, height: Math.round(rect.height * 100) / 100 } }; }
      function positionTargetComposer(rect) { const width = Math.min(360, window.innerWidth - 24); const left = Math.max(12, Math.min(rect.left, window.innerWidth - width - 12)); const estimatedHeight = 210; const railTop = window.innerHeight - 42; const top = rect.bottom + 12 + estimatedHeight < railTop ? rect.bottom + 12 : Math.max(12, Math.min(rect.top - estimatedHeight - 12, railTop - estimatedHeight - 12)); targetComposer.style.left = `${Math.round(left)}px`; targetComposer.style.top = `${Math.round(top)}px`; }
      function selectTarget(element, kind) { hoveredTarget?.classList.remove('target-hovered'); selectedTarget?.classList.remove('target-selected'); selectedTarget = element; selectedEnvelope = envelopeFor(element); selectedTarget.classList.add('target-selected'); composerKind = kind; targetContext.textContent = `${kind === 'comment' ? 'Comment on' : 'Target'}: ${targetName(selectedEnvelope)}`; targetRequestInput.placeholder = kind === 'comment' ? 'Leave feedback for the agent' : 'Describe the change'; targetComposer.setAttribute('aria-label', kind === 'comment' ? 'Comment on selected element' : 'Targeted change request'); targetRequestError.textContent = ''; targetComposer.hidden = false; positionTargetComposer(element.getBoundingClientRect()); setTargetMode(false); setCommentMode(false); targetRequestInput.focus(); }
      function candidateFor(node) { return node instanceof Element ? node.closest('[data-target-id]') : null; }
      document.addEventListener('pointerover', event => { if (!targetMode && !commentMode) return; const candidate = candidateFor(event.target); if (candidate === hoveredTarget) return; hoveredTarget?.classList.remove('target-hovered'); hoveredTarget = candidate; hoveredTarget?.classList.add('target-hovered'); }, true);
      document.addEventListener('click', event => { if (!targetMode && !commentMode) return; const candidate = candidateFor(event.target); if (!candidate) return; event.preventDefault(); event.stopImmediatePropagation(); selectTarget(candidate, commentMode ? 'comment' : 'request'); }, true);
      function pointFor(event) { return { x: Math.round(event.clientX * 100) / 100, y: Math.round(event.clientY * 100) / 100 }; }
      function updateDraftPath() { if (draftPath) draftPath.setAttribute('d', drawPath(draftPoints)); }
      drawingLayer.addEventListener('pointerdown', event => { if (!drawMode) return; event.preventDefault(); drawing = true; draftPoints = [pointFor(event)]; draftPath = document.createElementNS('http://www.w3.org/2000/svg', 'path'); draftPath.setAttribute('class', 'drawing-path'); drawingLayer.append(draftPath); drawingLayer.setPointerCapture(event.pointerId); updateDraftPath(); });
      drawingLayer.addEventListener('pointermove', event => { if (!drawing || draftPoints.length >= 240) return; const point = pointFor(event); const previous = draftPoints[draftPoints.length - 1]; if (Math.hypot(point.x - previous.x, point.y - previous.y) < 2) return; draftPoints.push(point); updateDraftPath(); });
      function finishDrawing(event) { if (!drawing) return; drawing = false; drawingLayer.releasePointerCapture?.(event.pointerId); draftPath?.remove(); draftPath = undefined; if (draftPoints.length >= 2 && socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'harness:annotation', annotation: { kind: 'draw', points: draftPoints, page: location.pathname } })); draftPoints = []; }
      drawingLayer.addEventListener('pointerup', finishDrawing); drawingLayer.addEventListener('pointercancel', finishDrawing);
      document.addEventListener('keydown', event => { if (event.key === 'Escape') { if (!targetComposer.hidden) closeTargetComposer(); setTargetMode(false); setCommentMode(false); setDrawMode(false); return; } if ((targetMode || commentMode || drawMode) && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); event.stopImmediatePropagation(); } }, true);
      input.addEventListener('input', resize); input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } }); document.querySelector('#open-request').addEventListener('click', openRequest); document.querySelector('#cancel-request').addEventListener('click', closeRequest); targetModeButton.addEventListener('click', () => setTargetMode(!targetMode)); commentModeButton.addEventListener('click', () => setCommentMode(!commentMode)); drawModeButton.addEventListener('click', () => setDrawMode(!drawMode)); workflowToggle.addEventListener('click', () => { workflowEl.open = !workflowEl.open; workflowToggle.textContent = workflowEl.open ? '⌄' : '⌃'; }); document.querySelector('#cancel-target-request').addEventListener('click', closeTargetComposer);
      form.addEventListener('submit', event => { event.preventDefault(); if (targetMode || commentMode || drawMode) return; const text = input.value.trim(); if (!text || socket?.readyState !== WebSocket.OPEN) return; socket.send(JSON.stringify({ type: 'chat:send', author, text })); input.value = ''; resize(); });
      requestForm.addEventListener('submit', event => { event.preventDefault(); const request = requestInput.value.trim(); if (!request) { requestError.textContent = 'Describe the change you want to make.'; return; } if (socket?.readyState !== WebSocket.OPEN) { requestError.textContent = 'Connection is not ready yet.'; return; } socket.send(JSON.stringify({ type: 'workflow:request', request })); requestInput.value = ''; closeRequest(); });
      targetComposer.addEventListener('submit', event => { event.preventDefault(); const text = targetRequestInput.value.trim(); if (!text) { targetRequestError.textContent = composerKind === 'comment' ? 'Write a brief comment.' : 'Describe the change you want to make.'; return; } if (!selectedEnvelope || socket?.readyState !== WebSocket.OPEN) { targetRequestError.textContent = 'Connection is not ready yet.'; return; } if (composerKind === 'comment') socket.send(JSON.stringify({ type: 'harness:annotation', annotation: { kind: 'comment', target: selectedEnvelope, text } })); else socket.send(JSON.stringify({ type: 'workflow:request', request: text, target: selectedEnvelope })); closeTargetComposer(); });
      requestDialog.addEventListener('click', event => { if (event.target === requestDialog) closeRequest(); }); connect(); resize();
    </script>
  </body>
