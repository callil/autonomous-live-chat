<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>App Harness</title>
    <style>
      :root { --accent: #8b5cf6; color: #0d0d0d; background: #fff; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #fff; }
      button, textarea { font: inherit; }
      .app { min-height: 100vh; display: grid; grid-template-columns: 52px minmax(0, 1fr); }
      .sidebar { border-right: 1px solid #ececec; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .rail-button { width: 38px; height: 38px; border: 0; border-radius: 8px; background: transparent; color: #202123; cursor: pointer; display: grid; place-items: center; font-size: 20px; line-height: 1; }
      .rail-button:hover, .rail-button[aria-current="page"], .rail-button[aria-pressed="true"] { background: #f1f1f1; }
      .brand { font-size: 15px; font-weight: 750; letter-spacing: -.06em; }
      .request-button { font-size: 20px; }
      main { min-width: 0; display: flex; flex-direction: column; }
      .topbar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
      .room-title { font-size: 14px; font-weight: 600; }
      .connection { color: #868686; font-size: 11px; display: flex; gap: 6px; align-items: center; }
      .dot, .status-dot { width: 7px; height: 7px; background: #999; border-radius: 999px; display: inline-block; }
      .dot.live { background: var(--accent); }
      .conversation { width: min(100%, 720px); margin: 0 auto; padding: 44px 24px 158px; flex: 1; }
      .empty { color: #777; font-size: 14px; margin-top: 18vh; text-align: center; }
      .messages { display: grid; gap: 22px; }
      .message { max-width: 660px; }
      .author { color: #555; font-size: 12px; font-weight: 600; margin: 0 0 5px; }
      .text { font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
      .composer-wrap { position: fixed; bottom: 0; left: 52px; right: 0; background: linear-gradient(to top, #fff 74%, rgba(255,255,255,0)); padding: 28px 24px 20px; }
      .composer { width: min(100%, 768px); margin: 0 auto; border: 1px solid #d8d8d8; border-radius: 14px; box-shadow: 0 3px 14px rgba(0,0,0,.07); background: #fff; padding: 9px 10px; display: flex; align-items: end; gap: 8px; }
      textarea { border: 0; outline: 0; resize: none; min-height: 25px; max-height: 180px; flex: 1; padding: 5px 4px; color: #171717; font-size: 15px; line-height: 1.45; background: transparent; }
      textarea::placeholder { color: #8e8e8e; }
      .send { border: 0; width: 32px; height: 32px; border-radius: 8px; background: #202123; color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 16px; }
      .send:disabled { background: #e5e5e5; color: #aaa; cursor: default; }
      .hint { width: min(100%, 768px); margin: 8px auto 0; text-align: center; color: #999; font-size: 11px; }
      .request-input { border: 1px solid #d9d9d9; border-radius: 9px; display: block; min-height: 92px; padding: 9px; width: 100%; }
      .dialog-actions { display: flex; justify-content: end; gap: 8px; margin-top: 12px; }
      .secondary, .primary { border: 0; border-radius: 8px; cursor: pointer; font-size: 13px; padding: 8px 11px; }
      .secondary { background: #f2f2f2; color: #333; }
      .primary { background: #202123; color: #fff; }
      .request-error { color: #b42318; font-size: 12px; margin: 8px 0 0; min-height: 17px; }
      .harness-frame { inset: 0; pointer-events: none; position: fixed; z-index: 10; }
      .harness-launcher, .authoring-popover, .annotation-panel, .target-composer, .comment-pin, .submission-toast { pointer-events: auto; }
      .harness-launcher { align-items: center; background: #202123; border: 0; border-radius: 999px; bottom: 104px; box-shadow: 0 7px 19px rgba(0,0,0,.17), 0 1px 2px rgba(0,0,0,.18); color: #fff; cursor: pointer; display: flex; font-size: 16px; font-weight: 750; height: 42px; justify-content: center; position: fixed; right: 18px; transition: background .15s ease, scale .15s ease; width: 42px; z-index: 5; }
      .harness-launcher:hover, .harness-launcher[aria-expanded="true"] { background: #353537; }
      .harness-launcher:active { scale: .96; }
      .authoring-popover { background: rgba(255,255,255,.98); border: 1px solid rgba(0,0,0,.11); border-radius: 13px; bottom: 156px; box-shadow: 0 12px 34px rgba(0,0,0,.15), 0 2px 5px rgba(0,0,0,.06); color: #333; padding: 8px; position: fixed; right: 18px; width: 230px; z-index: 4; }
      .authoring-popover[hidden] { display: none; }
      .authoring-heading { align-items: center; color: #686868; display: flex; font-size: 11px; font-weight: 650; justify-content: space-between; letter-spacing: .01em; padding: 1px 2px 7px 5px; }
      .authoring-tools { display: grid; gap: 4px; grid-template-columns: 1.18fr 1fr 1fr; }
      .authoring-notice { color: #606060; font-size: 11px; line-height: 1.35; margin: 7px 4px 1px; }
      .authoring-notice[hidden] { display: none; }
      .harness-tool { align-items: center; background: #f4f4f4; border: 0; border-radius: 8px; color: #303030; cursor: pointer; display: inline-flex; font-size: 12px; gap: 5px; height: 34px; justify-content: center; padding: 0 7px; transition: background .15s ease, scale .15s ease; }
      .harness-tool:hover, .harness-tool[aria-pressed="true"] { background: #eaeaea; }
      .harness-tool[aria-pressed="true"] { box-shadow: inset 0 -2px 0 var(--accent); color: #111; }
      .harness-tool:active, .annotation-toggle:active, .harness-dismiss:active { scale: .96; }
      .harness-tool svg { height: 15px; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; width: 15px; }
      .annotation-toggle { background: transparent; border: 0; border-radius: 7px; color: #666; cursor: pointer; display: flex; font: inherit; font-size: 11px; height: 28px; justify-content: space-between; margin-top: 5px; padding: 0 7px; transition: background .15s ease, scale .15s ease; width: 100%; }
      .annotation-toggle:hover { background: #f1f1f1; color: #333; }
      .annotation-panel { background: rgba(255,255,255,.99); border: 1px solid rgba(0,0,0,.11); border-radius: 13px; bottom: 156px; box-shadow: 0 12px 34px rgba(0,0,0,.15), 0 2px 5px rgba(0,0,0,.06); color: #333; padding: 10px; position: fixed; right: 18px; width: min(320px, calc(100vw - 24px)); z-index: 6; }
      .annotation-panel[hidden] { display: none; }
      .annotation-panel-header { align-items: center; display: flex; font-size: 12px; font-weight: 650; justify-content: space-between; margin-bottom: 7px; }
      .annotation-list, .work-item-list { display: grid; gap: 5px; list-style: none; margin: 0; max-height: 132px; overflow: auto; padding: 0; }
      .annotation-item { align-items: center; border-top: 1px solid #f0f0f0; display: flex; font-size: 12px; gap: 8px; min-height: 31px; padding: 6px 0; }
      .annotation-item span { flex: 1; line-height: 1.3; }
      .work-item { border-top: 1px solid #f0f0f0; display: grid; font-size: 12px; gap: 3px; padding: 7px 0; }
      .work-item-header { align-items: baseline; display: flex; gap: 7px; justify-content: space-between; }
      .work-item-summary { color: #333; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .work-item-phase { color: #8a5a00; font-size: 10px; font-variant-numeric: tabular-nums; text-transform: uppercase; white-space: nowrap; }
      .work-item-phase.completed { color: #11764c; } .work-item-phase.needs_review, .work-item-phase.rejected { color: #a34300; }
      .work-item-note { color: #767676; line-height: 1.35; }
      .work-item-links { display: flex; gap: 8px; font-size: 11px; }
      .work-item-links a { color: #555; text-decoration: underline; text-underline-offset: 2px; }
      .activity-divider { border: 0; border-top: 1px solid #e9e9e9; margin: 10px 0; }
      .annotation-remove, .annotation-close, .annotation-clear { border: 0; border-radius: 6px; cursor: pointer; font-size: 11px; padding: 5px 7px; }
      .annotation-remove, .annotation-close { background: #f1f1f1; color: #444; }
      .annotation-clear { background: #202123; color: #fff; margin-top: 9px; }
      .harness-dismiss { align-items: center; background: transparent; border: 0; border-radius: 6px; color: #888; cursor: pointer; display: inline-flex; font-size: 16px; height: 24px; justify-content: center; padding: 0; transition: background .15s ease, scale .15s ease; width: 24px; }
      .harness-dismiss:hover { background: #f1f1f1; color: #333; }
      .drawing-layer { height: 100%; inset: 0; pointer-events: none; position: fixed; visibility: hidden; width: 100%; z-index: 1; }
      .draw-mode-active .drawing-layer { cursor: crosshair; pointer-events: auto; }
      .authoring-open .drawing-layer, .authoring-open .comment-layer { visibility: visible; }
      .drawing-path { fill: none; pointer-events: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; }
      .comment-layer { inset: 0; pointer-events: none; position: fixed; visibility: hidden; z-index: 2; }
      .comment-pin { align-items: center; background: #202123; border: 2px solid #fff; border-radius: 999px; box-shadow: 0 2px 7px rgba(0,0,0,.22); color: #fff; cursor: default; display: flex; font-size: 10px; height: 18px; justify-content: center; position: fixed; transform: translate(-50%, -50%); width: 18px; }
      .target-mode-active [data-target-id] { cursor: crosshair; }
      .comment-mode-active [data-target-id] { cursor: crosshair; }
      .target-hovered { outline: 1px solid #5c5c5c; outline-offset: 3px; box-shadow: none; }
      .target-selected { outline: 2px solid #202123; outline-offset: 3px; box-shadow: none; }
      .submission-toast { background: rgba(32,33,35,.96); border-radius: 10px; bottom: 112px; box-shadow: 0 8px 24px rgba(0,0,0,.16); color: #fff; font-size: 12px; line-height: 1.35; max-width: min(360px, calc(100vw - 24px)); padding: 9px 12px; position: fixed; right: 18px; z-index: 7; }
      .submission-toast[hidden] { display: none; }
      .target-composer { animation: composer-rise .16s ease-out; bottom: 118px; left: 50%; position: fixed; transform: translateX(-50%); z-index: 5; width: min(420px, calc(100vw - 24px)); padding: 12px; border: 1px solid #d7d7d7; border-radius: 12px; background: #fff; box-shadow: 0 12px 34px rgba(0,0,0,.15); }
      .target-composer[hidden] { display: none; }
      .target-context { color: #666; display: block; font-size: 12px; line-height: 1.4; margin: 0 0 9px; }
      .target-composer .request-input { min-height: 74px; }
      @keyframes composer-rise { from { opacity: .2; transform: translateY(5px) translateX(-50%); } to { opacity: 1; transform: translateY(0) translateX(-50%); } }
      @media (prefers-reduced-motion: reduce) { .target-composer { animation: none; } }
      @media (max-width: 720px) { .app { grid-template-columns: 44px minmax(0, 1fr); } .sidebar { padding: 7px 3px; } .rail-button { width: 36px; height: 36px; } .composer-wrap { bottom: 0; left: 44px; padding: 24px 14px 14px; } .conversation { padding: 32px 18px 138px; } .topbar { padding: 0 18px; } .target-composer { bottom: 104px; width: min(420px, calc(100vw - 16px)); } .harness-launcher { bottom: 92px; right: 12px; } .authoring-popover, .annotation-panel { bottom: 140px; right: 12px; } .submission-toast { bottom: 144px; right: 12px; } }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" data-target-id="workspace-sidebar" data-target-label="Workspace navigation sidebar" aria-label="Workspace navigation">
        <div class="rail-button brand" data-target-id="sidebar-brand" data-target-label="App Harness brand" aria-label="App Harness">A</div>
        <button class="rail-button" data-target-id="rail-main-room" data-target-label="Main room control" type="button" aria-label="Main room" aria-current="page" title="Main room">#</button>
      </aside>
      <main>
        <header class="topbar" data-target-id="room-header" data-target-label="Main room header"><span class="room-title" data-target-id="room-title" data-target-text>Main room</span><span class="connection" data-target-id="connection-status" data-target-label="Connection status"><i class="dot" id="dot"></i><span id="connection">Connecting</span></span></header>
        <section class="conversation" aria-live="polite">
          <div class="empty" id="empty" data-target-id="empty-state" data-target-text>Start the conversation.</div><div class="messages" id="messages"></div>
        </section>
      </main>
    </div>
    <form class="composer-wrap" id="form" data-target-id="message-composer" data-target-label="Message composer">
      <div class="composer"><textarea id="input" data-target-id="message-input" data-target-label="Message input" aria-label="Message" rows="1" maxlength="2000" placeholder="Message Main room" autofocus></textarea><button class="send" id="send" data-target-id="send-message" data-target-label="Send message" type="submit" aria-label="Send message" disabled>↑</button></div>
      <div class="hint">Messages are shared live with everyone in this room.</div>
    </form>
    <div class="harness-frame" aria-label="App Harness overlay">
      <svg class="drawing-layer" id="drawing-layer" aria-label="Drawing feedback layer"></svg>
      <div class="comment-layer" id="comment-layer" aria-label="Comment markers"></div>
      <button class="harness-launcher" id="harness-launcher" data-target-id="harness-authoring-launcher" data-target-label="Open App Harness annotation tools" type="button" aria-label="Open App Harness annotation tools" aria-expanded="false" title="Annotate">✦</button>
      <section class="authoring-popover" id="authoring-popover" data-target-id="harness-authoring-popover" data-target-label="App Harness annotation tools" aria-label="App Harness annotation tools" hidden>
        <div class="authoring-heading"><span>Annotate</span><button class="harness-dismiss" id="harness-dismiss" data-target-id="harness-close-authoring-tools" data-target-label="Close annotation tools" type="button" aria-label="Close annotation tools" title="Close">×</button></div>
        <div class="authoring-tools">
        <button class="harness-tool target-tool" id="target-mode" data-target-id="harness-target-control" data-target-label="Inspect and target an element" type="button" aria-label="Inspect and target an element for a change request" aria-pressed="false" title="Inspect and target">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M8 8l8 8M8 16l8-8"/><circle cx="12" cy="12" r="4"/></svg><span>Target</span>
        </button>
        <button class="harness-tool" id="comment-mode" data-target-id="harness-comment-control" data-target-label="Comment on an element" type="button" aria-label="Comment on an element" aria-pressed="false" title="Comment">Comment</button>
        <button class="harness-tool" id="draw-mode" data-target-id="harness-draw-control" data-target-label="Draw feedback" type="button" aria-label="Draw feedback" aria-pressed="false" title="Draw">Draw</button>
        </div>
        <p class="authoring-notice" id="authoring-notice" role="status" hidden></p>
        <button class="annotation-toggle" id="annotation-count" data-target-id="harness-annotation-activity-control" data-target-label="Open activity and annotation list" type="button" aria-label="Open activity and annotation list">Activity <span id="activity-count-label">0</span></button>
      </section>
      <section class="annotation-panel" id="annotation-panel" data-target-id="harness-annotation-panel" data-target-label="Canvas annotation manager" aria-label="Canvas annotations" hidden>
        <div class="annotation-panel-header"><span>Activity</span><button class="annotation-close" id="annotation-close" data-target-id="harness-close-annotation-manager" data-target-label="Close activity and annotation list" type="button" aria-label="Close activity and annotation list">Close</button></div>
        <ul class="work-item-list" id="work-item-list"></ul>
        <hr class="activity-divider" />
        <div class="annotation-panel-header"><span>Canvas marks</span></div>
        <ul class="annotation-list" id="annotation-list"></ul>
        <button class="annotation-clear" id="annotation-clear" data-target-id="harness-clear-all-annotations" data-target-label="Clear all canvas annotations" type="button">Clear all canvas marks</button>
      </section>
      <div class="submission-toast" id="submission-toast" role="status" hidden></div>
    </div>
    <form class="target-composer" id="target-composer" hidden aria-label="Targeted change request">
      <span class="target-context" id="target-context"></span>
      <textarea class="request-input" id="target-request-input" aria-label="Targeted change request" maxlength="500" placeholder="Describe the change"></textarea>
      <div class="dialog-actions"><button class="secondary" id="cancel-target-request" type="button">Cancel</button><button class="secondary" id="done-target-request" type="button" hidden>Done</button><button class="primary" id="submit-target-request" type="submit">Start</button></div><p class="request-error" id="target-request-error" role="alert"></p>
    </form>
    <script>
      const messagesEl = document.querySelector('#messages'); const emptyEl = document.querySelector('#empty'); const input = document.querySelector('#input'); const send = document.querySelector('#send'); const form = document.querySelector('#form'); const dot = document.querySelector('#dot'); const connection = document.querySelector('#connection');
      const activityCount = document.querySelector('#activity-count-label'); const annotationToggle = document.querySelector('#annotation-count'); const annotationPanel = document.querySelector('#annotation-panel'); const annotationList = document.querySelector('#annotation-list'); const workItemList = document.querySelector('#work-item-list'); const annotationClose = document.querySelector('#annotation-close'); const annotationClear = document.querySelector('#annotation-clear'); const submissionToast = document.querySelector('#submission-toast');
      const harnessLauncher = document.querySelector('#harness-launcher'); const authoringPopover = document.querySelector('#authoring-popover'); const authoringNotice = document.querySelector('#authoring-notice'); const harnessDismiss = document.querySelector('#harness-dismiss'); const targetModeButton = document.querySelector('#target-mode'); const commentModeButton = document.querySelector('#comment-mode'); const drawModeButton = document.querySelector('#draw-mode'); const targetComposer = document.querySelector('#target-composer'); const targetContext = document.querySelector('#target-context'); const targetRequestInput = document.querySelector('#target-request-input'); const targetRequestError = document.querySelector('#target-request-error'); const targetSubmit = document.querySelector('#submit-target-request'); const targetDone = document.querySelector('#done-target-request'); const drawingLayer = document.querySelector('#drawing-layer'); const commentLayer = document.querySelector('#comment-layer');
      const author = localStorage.getItem('app-harness-author') || `Guest ${Math.floor(100 + Math.random() * 900)}`; localStorage.setItem('app-harness-author', author);
      let socket; let reconnectTimer; let toastTimer; let overlayOpen = false; let targetMode = false; let commentMode = false; let drawMode = false; let composerKind = 'request'; let hoveredTarget; let selectedTarget; let selectedEnvelope; let annotations = []; let workItems = []; let pendingSubmissionId; let pendingSubmissionKind; let drawing = false; let draftPoints = []; let draftPath; const rendered = new Set();
      function setConnection(text, live) { connection.textContent = text; dot.classList.toggle('live', live); }
      function render(message) { if (rendered.has(message.id)) return; rendered.add(message.id); emptyEl.hidden = true; const row = document.createElement('article'); row.className = 'message'; row.dataset.targetId = `message-${message.id}`; row.dataset.targetLabel = `Message from ${message.author}`; const name = document.createElement('div'); name.className = 'author'; name.textContent = message.author; const text = document.createElement('div'); text.className = 'text'; text.textContent = message.text; row.append(name, text); messagesEl.append(row); row.scrollIntoView({ behavior: 'smooth', block: 'end' }); }
      function targetName(target) { return target?.label || target?.text || target?.targetId?.replace(/[-_]+/g, ' ') || 'this element'; }
      function renderWorkflow() { /* The durable activity record remains available to connected clients without becoming permanent authoring chrome. */ }
      function drawPath(points) { return points.map((point, index) => `${index ? 'L' : 'M'}${point.x} ${point.y}`).join(' '); }
      function annotationDescription(annotation) { return annotation.kind === 'comment' ? `Comment on ${targetName(annotation.target)}` : 'Freehand drawing'; }
      function deleteAnnotation(annotationId) { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'harness:annotation:delete', annotationId })); }
      function renderAnnotations(next) { annotations = next; drawingLayer.replaceChildren(); commentLayer.replaceChildren(); annotationList.replaceChildren(); annotations.forEach(annotation => { if (annotation.kind === 'draw') { const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.setAttribute('class', 'drawing-path'); path.setAttribute('d', drawPath(annotation.points)); drawingLayer.append(path); } else { const pin = document.createElement('span'); pin.className = 'comment-pin'; pin.textContent = '•'; pin.title = `${targetName(annotation.target)}: ${annotation.text}`; pin.style.left = `${annotation.target.rect.x + annotation.target.rect.width}px`; pin.style.top = `${annotation.target.rect.y}px`; commentLayer.append(pin); } const item = document.createElement('li'); item.className = 'annotation-item'; const label = document.createElement('span'); label.textContent = annotation.kind === 'comment' ? `${annotationDescription(annotation)}: ${annotation.text}` : annotationDescription(annotation); const remove = document.createElement('button'); remove.className = 'annotation-remove'; remove.type = 'button'; remove.textContent = 'Remove'; remove.dataset.targetId = `harness-delete-annotation-${annotation.id}`; remove.dataset.targetLabel = `Remove ${annotationDescription(annotation)}`; remove.setAttribute('aria-label', `Remove ${annotationDescription(annotation)}`); remove.addEventListener('click', () => deleteAnnotation(annotation.id)); item.append(label, remove); annotationList.append(item); }); if (!annotations.length) { const empty = document.createElement('li'); empty.className = 'annotation-item'; empty.textContent = 'No canvas marks in this room.'; annotationList.append(empty); } }
      function phaseLabel(phase) { return { received: 'Received', triaged: 'Triaged', queued: 'Queued', building: 'Building', completed: 'Completed', rejected: 'Rejected', needs_review: 'Needs review' }[phase] || 'Recorded'; }
      function showAuthoringNotice(message) { authoringNotice.textContent = message; authoringNotice.hidden = false; }
      function showSubmissionToast(message) { submissionToast.textContent = message; submissionToast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { submissionToast.hidden = true; }, 5200); }
      function acknowledgeSubmission(item) { if (!pendingSubmissionId || item.clientSubmissionId !== pendingSubmissionId) return; const kind = pendingSubmissionKind; pendingSubmissionId = undefined; pendingSubmissionKind = undefined; const message = item.activity?.at(-1)?.message || `${phaseLabel(item.phase)}. Open Activity to follow it.`; if (kind === 'composer') { targetSubmit.hidden = true; targetDone.hidden = false; targetRequestError.textContent = message; } else { showAuthoringNotice(message); } showSubmissionToast(message); }
      function renderWorkItems(next) { workItems = next; workItemList.replaceChildren(); workItems.forEach(item => { const row = document.createElement('li'); row.className = 'work-item'; const header = document.createElement('div'); header.className = 'work-item-header'; const summary = document.createElement('span'); summary.className = 'work-item-summary'; summary.textContent = item.summary; const phase = document.createElement('span'); phase.className = `work-item-phase ${item.phase}`; phase.textContent = phaseLabel(item.phase); header.append(summary, phase); const note = document.createElement('span'); note.className = 'work-item-note'; note.textContent = item.activity?.at(-1)?.message || 'Recorded.'; row.append(header, note); if (item.githubIssue || item.githubPullRequestUrl) { const links = document.createElement('div'); links.className = 'work-item-links'; if (item.githubIssue) { const issue = document.createElement('a'); issue.href = item.githubIssue.url; issue.target = '_blank'; issue.rel = 'noreferrer'; issue.textContent = `Issue #${item.githubIssue.number}`; links.append(issue); } if (item.githubPullRequestUrl) { const pr = document.createElement('a'); pr.href = item.githubPullRequestUrl; pr.target = '_blank'; pr.rel = 'noreferrer'; pr.textContent = 'Pull request'; links.append(pr); } row.append(links); } workItemList.append(row); acknowledgeSubmission(item); }); if (!workItems.length) { const empty = document.createElement('li'); empty.className = 'work-item'; empty.textContent = 'No activity in this room yet.'; workItemList.append(empty); } activityCount.textContent = `${workItems.length}`; }
      function connect() { clearTimeout(reconnectTimer); const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'; socket = new WebSocket(`${protocol}//${location.host}/api/rooms/main`); socket.addEventListener('open', () => { setConnection('Live', true); resize(); }); socket.addEventListener('close', () => { setConnection('Reconnecting', false); resize(); reconnectTimer = setTimeout(connect, 1000); }); socket.addEventListener('error', () => socket.close()); socket.addEventListener('message', ({ data }) => { try { const event = JSON.parse(data); if (event.type === 'chat:snapshot') event.messages.forEach(render); if (event.type === 'chat:message') render(event.message); if (event.type === 'chat:presence') setConnection(`${event.count} live`, true); if (event.type === 'workflow:snapshot' || event.type === 'workflow:update') renderWorkflow(event.workflow); if (event.type === 'harness:annotations') renderAnnotations(event.annotations); if (event.type === 'harness:work-items') renderWorkItems(event.workItems); if (event.type === 'workflow:notice') { if (!targetComposer.hidden) { pendingSubmissionId = undefined; targetSubmit.hidden = false; targetDone.hidden = true; targetRequestError.textContent = event.message; } else { showSubmissionToast(event.message); } } } catch {} }); }
      function resize() { input.style.height = 'auto'; input.style.height = `${Math.min(input.scrollHeight, 180)}px`; send.disabled = targetMode || commentMode || drawMode || !input.value.trim() || socket?.readyState !== WebSocket.OPEN; }
      function clearTargetSelection() { hoveredTarget?.classList.remove('target-hovered'); selectedTarget?.classList.remove('target-selected'); hoveredTarget = undefined; selectedTarget = undefined; selectedEnvelope = undefined; }
      function closeTargetComposer() { targetComposer.hidden = true; targetRequestInput.value = ''; targetRequestError.textContent = ''; targetSubmit.hidden = false; targetSubmit.disabled = false; targetSubmit.textContent = 'Start'; targetDone.hidden = true; pendingSubmissionId = undefined; pendingSubmissionKind = undefined; clearTargetSelection(); }
      function setOverlayOpen(active) { overlayOpen = active; document.body.classList.toggle('authoring-open', active); authoringPopover.hidden = !active; harnessLauncher.setAttribute('aria-expanded', String(active)); harnessLauncher.setAttribute('aria-label', active ? 'Close App Harness annotation tools' : 'Open App Harness annotation tools'); harnessLauncher.title = active ? 'Close annotations' : 'Annotate'; if (!active) { setTargetMode(false); setCommentMode(false); setDrawMode(false); annotationPanel.hidden = true; } }
      function setTargetMode(active) { targetMode = active; document.body.classList.toggle('target-mode-active', active); targetModeButton.setAttribute('aria-pressed', String(active)); if (active) { setCommentMode(false); setDrawMode(false); closeTargetComposer(); } else hoveredTarget?.classList.remove('target-hovered'); resize(); }
      function setCommentMode(active) { commentMode = active; document.body.classList.toggle('comment-mode-active', active); commentModeButton.setAttribute('aria-pressed', String(active)); if (active) { setTargetMode(false); setDrawMode(false); closeTargetComposer(); } else hoveredTarget?.classList.remove('target-hovered'); resize(); }
      function setDrawMode(active) { drawMode = active; document.body.classList.toggle('draw-mode-active', active); drawModeButton.setAttribute('aria-pressed', String(active)); if (active) { setTargetMode(false); setCommentMode(false); closeTargetComposer(); } resize(); }
      function safeVisibleText(element) { return element.hasAttribute('data-target-text') ? element.textContent.trim().replace(/\s+/g, ' ').slice(0, 120) : undefined; }
      function envelopeFor(element) { const rect = element.getBoundingClientRect(); const targetId = element.dataset.targetId; const role = element.getAttribute('role') || (element.tagName === 'BUTTON' ? 'button' : element.tagName === 'TEXTAREA' ? 'textbox' : undefined); return { targetId, selector: `[data-target-id="${targetId}"]`, tag: element.tagName.toLowerCase(), role, label: element.dataset.targetLabel || element.getAttribute('aria-label') || undefined, text: safeVisibleText(element), page: location.pathname, room: 'main', rect: { x: Math.round(rect.x * 100) / 100, y: Math.round(rect.y * 100) / 100, width: Math.round(rect.width * 100) / 100, height: Math.round(rect.height * 100) / 100 } }; }
      function positionTargetComposer() { targetComposer.style.removeProperty('left'); targetComposer.style.removeProperty('top'); }
      function selectTarget(element, kind) { hoveredTarget?.classList.remove('target-hovered'); selectedTarget?.classList.remove('target-selected'); selectedTarget = element; selectedEnvelope = envelopeFor(element); selectedTarget.classList.add('target-selected'); composerKind = kind; overlayOpen = false; document.body.classList.remove('authoring-open'); authoringPopover.hidden = true; annotationPanel.hidden = true; harnessLauncher.setAttribute('aria-expanded', 'false'); harnessLauncher.setAttribute('aria-label', 'Open App Harness annotation tools'); harnessLauncher.title = 'Annotate'; targetContext.textContent = `${kind === 'comment' ? 'Comment on' : 'Target'}: ${targetName(selectedEnvelope)}`; targetRequestInput.placeholder = kind === 'comment' ? 'Leave feedback for the agent' : 'Describe the change'; targetComposer.setAttribute('aria-label', kind === 'comment' ? 'Comment on selected element' : 'Targeted change request'); targetRequestError.textContent = ''; targetSubmit.hidden = false; targetSubmit.disabled = false; targetSubmit.textContent = kind === 'comment' ? 'Record' : 'Start'; targetDone.hidden = true; targetComposer.hidden = false; positionTargetComposer(); setTargetMode(false); setCommentMode(false); setTimeout(() => selectedTarget?.classList.remove('target-selected'), 180); targetRequestInput.focus(); }
      function candidateFor(node) { return node instanceof Element ? node.closest('[data-target-id]') : null; }
      document.addEventListener('pointerover', event => { if (!targetMode && !commentMode) return; const candidate = candidateFor(event.target); if (candidate === hoveredTarget) return; hoveredTarget?.classList.remove('target-hovered'); hoveredTarget = candidate; hoveredTarget?.classList.add('target-hovered'); }, true);
      document.addEventListener('click', event => { if (!targetMode && !commentMode) return; const candidate = candidateFor(event.target); if (!candidate) return; event.preventDefault(); event.stopImmediatePropagation(); selectTarget(candidate, commentMode ? 'comment' : 'request'); }, true);
      function pointFor(event) { return { x: Math.round(event.clientX * 100) / 100, y: Math.round(event.clientY * 100) / 100 }; }
      function updateDraftPath() { if (draftPath) draftPath.setAttribute('d', drawPath(draftPoints)); }
      drawingLayer.addEventListener('pointerdown', event => { if (!drawMode) return; event.preventDefault(); drawing = true; draftPoints = [pointFor(event)]; draftPath = document.createElementNS('http://www.w3.org/2000/svg', 'path'); draftPath.setAttribute('class', 'drawing-path'); drawingLayer.append(draftPath); drawingLayer.setPointerCapture(event.pointerId); updateDraftPath(); });
      drawingLayer.addEventListener('pointermove', event => { if (!drawing || draftPoints.length >= 240) return; const point = pointFor(event); const previous = draftPoints[draftPoints.length - 1]; if (Math.hypot(point.x - previous.x, point.y - previous.y) < 2) return; draftPoints.push(point); updateDraftPath(); });
      function finishDrawing(event) { if (!drawing) return; drawing = false; drawingLayer.releasePointerCapture?.(event.pointerId); draftPath?.remove(); draftPath = undefined; if (draftPoints.length >= 2 && socket?.readyState === WebSocket.OPEN) { pendingSubmissionId = crypto.randomUUID(); pendingSubmissionKind = 'draw'; showAuthoringNotice('Saving drawing…'); socket.send(JSON.stringify({ type: 'harness:annotation', clientSubmissionId: pendingSubmissionId, annotation: { kind: 'draw', points: draftPoints, page: location.pathname } })); } draftPoints = []; }
      drawingLayer.addEventListener('pointerup', finishDrawing); drawingLayer.addEventListener('pointercancel', finishDrawing);
      document.addEventListener('keydown', event => { if (event.key === 'Escape') { const active = targetMode || commentMode || drawMode || !targetComposer.hidden; if (!targetComposer.hidden) closeTargetComposer(); setTargetMode(false); setCommentMode(false); setDrawMode(false); if (!active && overlayOpen) setOverlayOpen(false); return; } if ((targetMode || commentMode || drawMode) && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); event.stopImmediatePropagation(); } }, true);
      input.addEventListener('input', resize); input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } }); harnessLauncher.addEventListener('click', () => { if (!annotationPanel.hidden) { annotationPanel.hidden = true; setOverlayOpen(false); return; } setOverlayOpen(!overlayOpen); }); harnessDismiss.addEventListener('click', () => setOverlayOpen(false)); targetModeButton.addEventListener('click', () => setTargetMode(!targetMode)); commentModeButton.addEventListener('click', () => setCommentMode(!commentMode)); drawModeButton.addEventListener('click', () => setDrawMode(!drawMode)); annotationToggle.addEventListener('click', () => { annotationPanel.hidden = !annotationPanel.hidden; if (!annotationPanel.hidden) { overlayOpen = false; authoringPopover.hidden = true; harnessLauncher.setAttribute('aria-expanded', 'true'); harnessLauncher.setAttribute('aria-label', 'Close App Harness activity'); harnessLauncher.title = 'Close activity'; } }); annotationClose.addEventListener('click', () => { annotationPanel.hidden = true; harnessLauncher.setAttribute('aria-expanded', 'false'); harnessLauncher.setAttribute('aria-label', 'Open App Harness annotation tools'); harnessLauncher.title = 'Annotate'; }); annotationClear.addEventListener('click', () => { if (!annotations.length || socket?.readyState !== WebSocket.OPEN) return; if (confirm('Clear all canvas marks for this room? Chat messages will not be changed.')) socket.send(JSON.stringify({ type: 'harness:annotations:clear' })); }); document.querySelector('#cancel-target-request').addEventListener('click', closeTargetComposer); targetDone.addEventListener('click', closeTargetComposer);
      form.addEventListener('submit', event => { event.preventDefault(); if (targetMode || commentMode || drawMode) return; const text = input.value.trim(); if (!text || socket?.readyState !== WebSocket.OPEN) return; socket.send(JSON.stringify({ type: 'chat:send', author, text })); input.value = ''; resize(); });
      targetComposer.addEventListener('submit', event => { event.preventDefault(); const text = targetRequestInput.value.trim(); if (!text) { targetRequestError.textContent = composerKind === 'comment' ? 'Write a brief comment.' : 'Describe the change you want to make.'; return; } if (!selectedEnvelope || socket?.readyState !== WebSocket.OPEN) { targetRequestError.textContent = 'Connection is not ready yet.'; return; } pendingSubmissionId = crypto.randomUUID(); pendingSubmissionKind = 'composer'; targetSubmit.disabled = true; targetRequestError.textContent = composerKind === 'comment' ? 'Recording and creating an activity item…' : 'Submitting and creating an activity item…'; if (composerKind === 'comment') socket.send(JSON.stringify({ type: 'harness:annotation', clientSubmissionId: pendingSubmissionId, annotation: { kind: 'comment', target: selectedEnvelope, text } })); else socket.send(JSON.stringify({ type: 'workflow:request', clientSubmissionId: pendingSubmissionId, request: text, target: selectedEnvelope })); });
      connect(); resize();
