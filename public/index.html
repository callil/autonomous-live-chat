<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>App Harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..650&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet" referrerpolicy="no-referrer" />
    <link href="/app.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <main>
        <header class="topbar" data-target-id="room-header" data-target-label="Main room header"><span class="room-heading"><span class="room-title" data-target-id="room-title" data-target-text>Main room</span><span class="room-meta">shared workspace</span></span><span class="connection" data-target-id="connection-status" data-target-label="Connection status"><i class="dot" id="dot"></i><span id="connection">Connecting</span></span></header>
        <section class="conversation" aria-live="polite">
          <div class="room-intro" data-target-id="room-introduction" data-target-label="Main room introduction">
            <span class="room-intro-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3M8 12h8M12 8v8"/></svg></span>
            <div><h1>This app can change itself</h1><p>Chat with the room. Open App Harness to point at a specific element and request a change.</p></div>
          </div>
          <div class="empty" id="empty" data-target-id="empty-state" data-target-text>Start the conversation.</div><div class="messages" id="messages"></div>
        </section>
      </main>
    </div>
    <form class="composer-wrap" id="form" data-target-id="message-composer" data-target-label="Message composer">
      <div class="composer"><textarea id="input" data-target-id="message-input" data-target-label="Message input" aria-label="Message" aria-describedby="message-count" rows="1" maxlength="500" placeholder="Message the room" autofocus></textarea><button class="send" id="send" data-target-id="send-message" data-target-label="Send message" type="submit" aria-label="Send message" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 12 5-5 5 5M12 7v10"/></svg></button></div>
      <div class="composer-meta"><span class="hint">Shared live · press Enter to send, Shift + Enter for a new line</span><output class="message-count" id="message-count" aria-live="polite">0 / 500</output></div>
    </form>
    <div class="harness-frame" aria-label="App Harness overlay">
      <svg class="drawing-layer" id="drawing-layer" aria-label="Drawing feedback layer"></svg>
      <div class="comment-layer" id="comment-layer" aria-label="Comment markers"></div>
      <button class="harness-launcher" id="harness-launcher" data-target-id="harness-authoring-launcher" data-target-label="Open App Harness annotation tools" type="button" aria-label="Open App Harness annotation tools" aria-expanded="false" title="Open App Harness"><svg class="launcher-open-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3M8 12h8M12 8v8"/></svg><svg class="launcher-close-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg><span class="launcher-badge" id="launcher-badge" aria-hidden="true" hidden></span></button>
      <section class="authoring-popover" id="authoring-popover" data-target-id="harness-authoring-popover" data-target-label="App Harness annotation tools" aria-label="App Harness annotation tools" hidden>
        <div class="authoring-heading"><span>App Harness</span><button class="harness-dismiss" id="harness-dismiss" data-target-id="harness-close-authoring-tools" data-target-label="Close annotation tools" type="button" aria-label="Close annotation tools" title="Close">×</button></div>
        <div class="authoring-tools">
        <button class="harness-tool target-tool" id="target-mode" data-target-id="harness-target-control" data-target-label="Inspect and target an element" type="button" aria-label="Inspect and target an element for a change request" aria-pressed="false" title="Inspect and target">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M8 8l8 8M8 16l8-8"/><circle cx="12" cy="12" r="4"/></svg><span>Target</span>
        </button>
        <button class="harness-tool" id="comment-mode" data-target-id="harness-comment-control" data-target-label="Comment on an element" type="button" aria-label="Comment on an element" aria-pressed="false" title="Comment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg><span>Comment</span></button>
        <button class="harness-tool" id="draw-mode" data-target-id="harness-draw-control" data-target-label="Draw feedback" type="button" aria-label="Draw feedback" aria-pressed="false" title="Draw"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.2-1 10.9-10.9a2.2 2.2 0 0 0-3.2-3.2L5 15.8 4 20zM13.8 7l3.2 3.2"/></svg><span>Draw</span></button>
        </div>
        <p class="authoring-notice" id="authoring-notice" role="status" hidden></p>
        <button class="annotation-toggle" id="annotation-count" data-target-id="harness-annotation-activity-control" data-target-label="Open activity and annotation list" type="button" aria-label="Open activity and annotation list">Activity <span class="activity-count-badge" id="activity-count-label">0</span></button>
      </section>
      <section class="annotation-panel" id="annotation-panel" data-target-id="harness-annotation-panel" data-target-label="Canvas annotation manager" aria-label="Activity and canvas annotations" hidden>
        <div class="annotation-panel-header"><span>Activity</span><button class="annotation-close" id="annotation-close" data-target-id="harness-close-annotation-manager" data-target-label="Close activity and annotation list" type="button" aria-label="Close activity and annotation list">Close</button></div>
        <ul class="work-item-list" id="work-item-list"></ul>
        <hr class="activity-divider" />
        <div class="annotation-panel-header"><span>Canvas marks</span></div>
        <ul class="annotation-list" id="annotation-list"></ul>
        <button class="annotation-clear" id="annotation-clear" data-target-id="harness-clear-all-annotations" data-target-label="Clear all canvas annotations" type="button">Clear all canvas marks</button>
      </section>
      <div class="submission-toast" id="submission-toast" role="status" hidden></div>
    </div>
    <form class="target-composer" id="target-composer" hidden aria-label="Targeted change request">
      <span class="target-context" id="target-context"></span>
      <textarea class="request-input" id="target-request-input" aria-label="Targeted change request" maxlength="500" placeholder="Describe the change"></textarea>
      <div class="dialog-actions"><button class="secondary" id="cancel-target-request" type="button">Cancel</button><button class="secondary" id="done-target-request" type="button" hidden>Done</button><button class="primary" id="submit-target-request" type="submit">Start</button></div><p class="request-error" id="target-request-error" role="alert"></p>
    </form>
    <script>
      const messagesEl = document.querySelector('#messages'); const emptyEl = document.querySelector('#empty'); const input = document.querySelector('#input'); const messageCount = document.querySelector('#message-count'); const send = document.querySelector('#send'); const form = document.querySelector('#form'); const dot = document.querySelector('#dot'); const connection = document.querySelector('#connection');
      const activityCount = document.querySelector('#activity-count-label'); const launcherBadge = document.querySelector('#launcher-badge'); const annotationToggle = document.querySelector('#annotation-count'); const annotationPanel = document.querySelector('#annotation-panel'); const annotationList = document.querySelector('#annotation-list'); const workItemList = document.querySelector('#work-item-list'); const annotationClose = document.querySelector('#annotation-close'); const annotationClear = document.querySelector('#annotation-clear'); const submissionToast = document.querySelector('#submission-toast');
      const harnessLauncher = document.querySelector('#harness-launcher'); const authoringPopover = document.querySelector('#authoring-popover'); const authoringNotice = document.querySelector('#authoring-notice'); const harnessDismiss = document.querySelector('#harness-dismiss'); const targetModeButton = document.querySelector('#target-mode'); const commentModeButton = document.querySelector('#comment-mode'); const drawModeButton = document.querySelector('#draw-mode'); const targetComposer = document.querySelector('#target-composer'); const targetContext = document.querySelector('#target-context'); const targetRequestInput = document.querySelector('#target-request-input'); const targetRequestError = document.querySelector('#target-request-error'); const targetSubmit = document.querySelector('#submit-target-request'); const targetDone = document.querySelector('#done-target-request'); const drawingLayer = document.querySelector('#drawing-layer'); const commentLayer = document.querySelector('#comment-layer');
      const author = localStorage.getItem('app-harness-author') || `Guest ${Math.floor(100 + Math.random() * 900)}`; localStorage.setItem('app-harness-author', author);
      let socket; let reconnectTimer; let toastTimer; let overlayOpen = false; let targetMode = false; let commentMode = false; let drawMode = false; let composerKind = 'request'; let hoveredTarget; let selectedTarget; let selectedEnvelope; let annotations = []; let workItems = []; let pendingSubmissionId; let pendingSubmissionKind; let drawing = false; let draftPoints = []; let draftPath; const rendered = new Set();
      function initials(value) { return value.trim().split(/\s+/).slice(0, 2).map(part => part[0]).join('').slice(0, 2) || 'G'; }
      function setConnection(text, live) { connection.textContent = text; dot.classList.toggle('live', live); }
      function render(message) { if (rendered.has(message.id)) return; rendered.add(message.id); emptyEl.hidden = true; const row = document.createElement('article'); row.className = 'message'; row.dataset.targetId = `message-${message.id}`; row.dataset.targetLabel = `Message from ${message.author}`; const avatar = document.createElement('div'); avatar.className = 'message-avatar'; avatar.textContent = initials(message.author); avatar.setAttribute('aria-hidden', 'true'); const body = document.createElement('div'); body.className = 'message-body'; const meta = document.createElement('div'); meta.className = 'message-meta'; const name = document.createElement('div'); name.className = 'author'; name.textContent = message.author; const time = document.createElement('time'); time.className = 'message-time'; time.dateTime = new Date(message.createdAt).toISOString(); time.textContent = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(message.createdAt); const text = document.createElement('div'); text.className = 'text'; text.textContent = message.text; meta.append(name, time); body.append(meta, text); row.append(avatar, body); messagesEl.append(row); row.scrollIntoView({ behavior: rendered.size > 1 ? 'smooth' : 'auto', block: 'end' }); }
      function targetName(target) { return target?.label || target?.text || target?.targetId?.replace(/[-_]+/g, ' ') || 'this element'; }

      function annotationDescription(annotation) { return annotation.kind === 'comment' ? `Comment on ${targetName(annotation.target)}` : 'Freehand drawing'; }
      function deleteAnnotation(annotationId) { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: 'harness:annotation:delete', annotationId })); }
      function renderAnnotations(next) { annotations = next; drawingLayer.replaceChildren(); commentLayer.replaceChildren(); annotationList.replaceChildren(); annotations.forEach(annotation => { if (annotation.kind === 'draw') { const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.setAttribute('class', 'drawing-path'); path.setAttribute('d', drawPath(annotation.points)); drawingLayer.append(path); } else { const pin = document.createElement('span'); pin.className = 'comment-pin'; pin.textContent = '•'; pin.title = `${targetName(annotation.target)}: ${annotation.text}`; pin.style.left = `${annotation.target.rect.x + annotation.target.rect.width}px`; pin.style.top = `${annotation.target.rect.y}px`; commentLayer.append(pin); } const item = document.createElement('li'); item.className = 'annotation-item'; const label = document.createElement('span'); label.textContent = annotation.kind === 'comment' ? `${annotationDescription(annotation)}: ${annotation.text}` : annotationDescription(annotation); const remove = document.createElement('button'); remove.className = 'annotation-remove'; remove.type = 'button'; remove.textContent = 'Remove'; remove.dataset.targetId = `harness-delete-annotation-${annotation.id}`; remove.dataset.targetLabel = `Remove ${annotationDescription(annotation)}`; remove.setAttribute('aria-label', `Remove ${annotationDescription(annotation)}`); remove.addEventListener('click', () => deleteAnnotation(annotation.id)); item.append(label, remove); annotationList.append(item); }); if (!annotations.length) { const empty = document.createElement('li'); empty.className = 'annotation-item'; empty.textContent = 'No canvas marks in this room.'; annotationList.append(empty); } }
      function phaseLabel(phase) { return { received: 'Received', triaged: 'Triaged', queued: 'Queued', building: 'Building', completed: 'Completed', rejected: 'Rejected', needs_review: 'Needs review' }[phase] || 'Recorded'; }
      function showAuthoringNotice(message) { authoringNotice.textContent = message; authoringNotice.hidden = false; }
      function showSubmissionToast(message) { submissionToast.textContent = message; submissionToast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { submissionToast.hidden = true; }, 5200); }

      function renderWorkItems(next) {

          const phase = document.createElement('span');

          const note = document.createElement('span');

          note.textContent = item.activity?.at(-1)?.message || 'Recorded.';
          row.append(header, note);

            links.className = 'work-item-links';
            if (item.githubIssue) {
              const issue = document.createElement('a');
              issue.href = item.githubIssue.url;
              issue.target = '_blank';
              issue.rel = 'noreferrer';
              issue.textContent = `Issue #${item.githubIssue.number}`;
              links.append(issue);

            if (item.githubPullRequestUrl) {
              const pullRequest = document.createElement('a');
              pullRequest.href = item.githubPullRequestUrl;
              pullRequest.target = '_blank';
              pullRequest.rel = 'noreferrer';

        launcherBadge.textContent = activeItems.length > 9 ? '9+' : `${activeItems.length}`;

      function connect() { clearTimeout(reconnectTimer); const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'; socket = new WebSocket(`${protocol}//${location.host}/api/rooms/main`); socket.addEventListener('open', () => { setConnection('Live', true); resize(); }); socket.addEventListener('close', () => { setConnection('Reconnecting', false); resize(); reconnectTimer = setTimeout(connect, 1000); }); socket.addEventListener('error', () => socket.close()); socket.addEventListener('message', ({ data }) => { try { const event = JSON.parse(data); if (event.type === 'chat:snapshot') event.messages.forEach(render); if (event.type === 'chat:message') render(event.message); if (event.type === 'chat:presence') setConnection(`${event.count} live`, true); if (event.type === 'harness:annotations') renderAnnotations(event.annotations); if (event.type === 'harness:work-items') renderWorkItems(event.workItems); if (event.type === 'workflow:notice') { if (!targetComposer.hidden) { pendingSubmissionId = undefined; targetSubmit.hidden = false; targetDone.hidden = true; targetRequestError.textContent = event.message; } else { showSubmissionToast(event.message); } } } catch {} }); }

      function setCommentMode(active) { commentMode = active; document.body.classList.toggle('comment-mode-active', active); commentModeButton.setAttribute('aria-pressed', String(active)); if (active) { setTargetMode(false); setDrawMode(false); closeTargetComposer(); } else hoveredTarget?.classList.remove('target-hovered'); resize(); }

      input.addEventListener('input', resize); input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); } }); harnessLauncher.addEventListener('click', () => { if (!annotationPanel.hidden) { annotationPanel.hidden = true; setOverlayOpen(false); return; } setOverlayOpen(!overlayOpen); }); harnessDismiss.addEventListener('click', () => setOverlayOpen(false)); targetModeButton.addEventListener('click', () => setTargetMode(!targetMode)); commentModeButton.addEventListener('click', () => setCommentMode(!commentMode)); drawModeButton.addEventListener('click', () => setDrawMode(!drawMode)); annotationToggle.addEventListener('click', () => { annotationPanel.hidden = !annotationPanel.hidden; if (!annotationPanel.hidden) { overlayOpen = false; authoringPopover.hidden = true; harnessLauncher.setAttribute('aria-expanded', 'true'); harnessLauncher.setAttribute('aria-label', 'Close App Harness activity'); harnessLauncher.title = 'Close activity'; } }); annotationClose.addEventListener('click', () => { annotationPanel.hidden = true; harnessLauncher.setAttribute('aria-expanded', 'false'); harnessLauncher.setAttribute('aria-label', 'Open App Harness annotation tools'); harnessLauncher.title = 'Open App Harness'; }); annotationClear.addEventListener('click', () => { if (!annotations.length || socket?.readyState !== WebSocket.OPEN) return; if (confirm('Clear all canvas marks for this room? Chat messages will not be changed.')) socket.send(JSON.stringify({ type: 'harness:annotations:clear' })); }); document.querySelector('#cancel-target-request').addEventListener('click', closeTargetComposer); targetDone.addEventListener('click', closeTargetComposer);
      form.addEventListener('submit', event => { event.preventDefault(); if (targetMode || commentMode || drawMode) return; const text = input.value.trim(); if (!text || socket?.readyState !== WebSocket.OPEN) return; socket.send(JSON.stringify({ type: 'chat:send', author, text })); input.value = ''; resize(); });
      targetComposer.addEventListener('submit', event => { event.preventDefault(); targetRequestError.classList.remove('acknowledged'); const text = targetRequestInput.value.trim(); if (!text) { targetRequestError.textContent = composerKind === 'comment' ? 'Write a brief comment.' : 'Describe the change you want to make.'; return; } if (!selectedEnvelope || socket?.readyState !== WebSocket.OPEN) { targetRequestError.textContent = 'Connection is not ready yet.'; return; } pendingSubmissionId = crypto.randomUUID(); pendingSubmissionKind = 'composer'; targetSubmit.disabled = true; targetRequestError.textContent = composerKind === 'comment' ? 'Recording and creating an activity item…' : 'Submitting and creating an activity item…'; if (composerKind === 'comment') socket.send(JSON.stringify({ type: 'harness:annotation', clientSubmissionId: pendingSubmissionId, annotation: { kind: 'comment', target: selectedEnvelope, text } })); else socket.send(JSON.stringify({ type: 'workflow:request', clientSubmissionId: pendingSubmissionId, request: text, target: selectedEnvelope })); });
      connect(); resize();
    </script>
