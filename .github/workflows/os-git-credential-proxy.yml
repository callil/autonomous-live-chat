name: Deploy OS Git credential proxy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-harness-os-git-credential-proxy-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: os-git-credential-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GIT_PROXY_ASSERTION_SECRET: ${{ secrets.GIT_PROXY_ASSERTION_SECRET }}
      APP_HARNESS_IDENTITY_SECRET: ${{ secrets.APP_HARNESS_IDENTITY_SECRET }}
      APP_HARNESS_GITHUB_APP_ID: ${{ secrets.APP_HARNESS_GITHUB_APP_ID }}
      APP_HARNESS_GITHUB_APP_INSTALLATION_ID: ${{ secrets.APP_HARNESS_GITHUB_APP_INSTALLATION_ID }}
      APP_HARNESS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_HARNESS_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os-git-credential-proxy/package-lock.json
      - name: Install and verify proxy
        run: |
          npm ci
          npm run cf-typegen
          npm run typecheck
      - name: Deploy default-deny credential proxy
        run: npx wrangler deploy
      - name: Install proxy secrets
        shell: bash
        run: |
          test -n "$GIT_PROXY_ASSERTION_SECRET"
          test -n "$APP_HARNESS_IDENTITY_SECRET"
          test -n "$APP_HARNESS_GITHUB_APP_ID"
          test -n "$APP_HARNESS_GITHUB_APP_INSTALLATION_ID"
          test -n "$APP_HARNESS_GITHUB_APP_PRIVATE_KEY"
          printf '%s' "$GIT_PROXY_ASSERTION_SECRET" | npx wrangler secret put GIT_PROXY_ASSERTION_SECRET --name app-harness-os-git-proxy
          printf '%s' "$APP_HARNESS_IDENTITY_SECRET" | npx wrangler secret put APP_HARNESS_IDENTITY_SECRET --name app-harness-os-git-proxy
          printf '%s' "$APP_HARNESS_GITHUB_APP_ID" | npx wrangler secret put GITHUB_APP_ID --name app-harness-os-git-proxy
          printf '%s' "$APP_HARNESS_GITHUB_APP_INSTALLATION_ID" | npx wrangler secret put GITHUB_APP_INSTALLATION_ID --name app-harness-os-git-proxy
          printf '%s' "$APP_HARNESS_GITHUB_APP_PRIVATE_KEY" | npx wrangler secret put GITHUB_APP_PRIVATE_KEY --name app-harness-os-git-proxy
