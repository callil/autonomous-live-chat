name: Promote App Harness OS candidate
run-name: App Harness promotion · ${{ inputs.dispatch_key }}

on:
  workflow_dispatch:
    inputs:
      pull_request: { required: true, type: string }
      stack_id: { required: true, type: string }
      generation: { required: true, type: string }
      issue_number: { required: true, type: string }
      node_id: { required: true, type: string }
      parent_branch: { required: true, type: string }
      head_sha: { required: true, type: string }
      dispatch_key: { required: true, type: string }
      ci_profile: { required: true, type: string }

permissions: {}

# Every main mutation and production deployment shares one lock. Input values
# cannot create parallel promotion lanes or permit an older deployment to win.
concurrency:
  group: app-harness-main-promotion-and-deploy
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      pull_request: ${{ steps.candidate.outputs.pull_request }}
      head_sha: ${{ steps.candidate.outputs.head_sha }}
      head_ref: ${{ steps.candidate.outputs.head_ref }}
      candidate_base_sha: ${{ steps.candidate.outputs.candidate_base_sha }}
      already_merged: ${{ steps.candidate.outputs.already_merged }}
      merge_sha: ${{ steps.candidate.outputs.merge_sha }}
      current_main_sha: ${{ steps.main.outputs.sha }}
      validation_run_id: ${{ steps.validation.outputs.validation_run_id }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pull_request }}
      EXPECTED_PARENT: ${{ inputs.parent_branch }}
      EXPECTED_HEAD: ${{ inputs.head_sha }}
      EXPECTED_ISSUE: ${{ inputs.issue_number }}
      EXPECTED_GENERATION: ${{ inputs.generation }}
      EXPECTED_STACK: ${{ inputs.stack_id }}
      EXPECTED_NODE: ${{ inputs.node_id }}
      # Promotion verifies against the server-side stack object: the candidate
      # must be the bottom open member of its stack, so the cascade merge below
      # can only ever land exactly this one pull request.
      REQUIRE_BOTTOM: "true"
    steps:
      - name: Require the canonical stack promotion policy
        env:
          CI_PROFILE: ${{ inputs.ci_profile }}
        run: |
          # The bottom node's parent is main; a retargeted survivor's recorded
          # parent is a canonical sibling node branch. Nothing else promotes.
          case "$EXPECTED_PARENT" in
            main) ;;
            app-harness-os/*/g*) ;;
            *) echo "Unsupported stack parent: $EXPECTED_PARENT"; exit 1 ;;
          esac
          case "$CI_PROFILE" in
            visual|content|behavior|data|infrastructure) ;;
            *) echo "Unsupported CI profile: $CI_PROFILE"; exit 1 ;;
          esac
      - name: Check out trusted promotion verifier from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Capture fresh current main
        id: main
        run: |
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          test "$local_sha" = "$remote_sha"
          printf 'sha=%s\n' "$local_sha" >> "$GITHUB_OUTPUT"
      - name: Verify immutable candidate provenance and scope from trusted main
        id: candidate
        env:
          ALLOW_MERGED: true
        run: node infra/scripts/os-stack-gate.mjs verify-pr
      - name: Wait for the newest GitHub Actions validation bound to this PR and head
        id: validation
        env:
          EXPECTED_HEAD: ${{ steps.candidate.outputs.head_sha }}
          EXPECTED_HEAD_REF: ${{ steps.candidate.outputs.head_ref }}
          PR: ${{ steps.candidate.outputs.pull_request }}
        run: node infra/scripts/os-stack-gate.mjs wait-validation

  integrate:
    needs: prepare
    if: needs.prepare.outputs.already_merged != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      integration_tree: ${{ steps.merge.outputs.tree }}
    env:
      CURRENT_MAIN: ${{ needs.prepare.outputs.current_main_sha }}
      EXPECTED_HEAD: ${{ needs.prepare.outputs.head_sha }}
      PR: ${{ needs.prepare.outputs.pull_request }}
    steps:
      - name: Check out captured current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.current_main_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch immutable candidate, remove credentials, and synthesize integration
        id: merge
        run: |
          git fetch --no-tags origin "refs/pull/${PR}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config --local --unset-all http.https://github.com/.extraheader || true
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo 'Checkout credentials remained available to candidate code.'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$CURRENT_MAIN"
          git config user.name 'App Harness OS integration gate'
          git config user.email 'app-harness-os@users.noreply.github.com'
          git merge --no-commit --no-ff "$EXPECTED_HEAD"
          if git diff --cached --quiet; then
            echo 'Candidate is empty against current main.'
            exit 1
          fi
          git diff --cached --check
          printf 'tree=%s\n' "$(git write-tree)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact integration dependencies without privileged secrets
        run: npm ci
      - name: Test exact current-main integration without privileged secrets
        run: npm run check

  promote:
    needs: [prepare, integrate]
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.already_merged == 'true' || needs.integrate.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      deployment_sha: ${{ steps.verify_merge.outputs.deployment_sha }}
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ needs.prepare.outputs.pull_request }}
      EXPECTED_PARENT: ${{ inputs.parent_branch }}
      EXPECTED_HEAD: ${{ needs.prepare.outputs.head_sha }}
      EXPECTED_ISSUE: ${{ inputs.issue_number }}
      EXPECTED_GENERATION: ${{ inputs.generation }}
      EXPECTED_STACK: ${{ inputs.stack_id }}
      EXPECTED_NODE: ${{ inputs.node_id }}
      CURRENT_MAIN: ${{ needs.prepare.outputs.current_main_sha }}
      ALREADY_MERGED: ${{ needs.prepare.outputs.already_merged }}
      RECORDED_MERGE_SHA: ${{ needs.prepare.outputs.merge_sha }}
      EXPECTED_TREE: ${{ needs.integrate.outputs.integration_tree }}
    steps:
      - name: Check out trusted captured main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.current_main_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Reverify immutable provenance immediately before mutation
        env:
          ALLOW_MERGED: true
          GH_TOKEN: ${{ github.token }}
          REQUIRE_BOTTOM: "true"
        run: node infra/scripts/os-stack-gate.mjs verify-pr
      # Every candidate is submitted with `gh stack submit`, so every candidate
      # PR is a server-side stack member — and GitHub documents that the legacy
      # pull request merge endpoints cannot merge a stack. The merge below goes
      # through the pinned gh-stack CLI instead. Same release-pin + sha256
      # discipline as infra/workers/native-git-runner/Dockerfile.
      - name: Install the release-pinned gh stack CLI extension
        if: env.ALREADY_MERGED != 'true'
        env:
          GH_STACK_VERSION: "0.1.0"
          GH_STACK_AMD64_SHA256: 358552dd7dce0a46ce153fe196270cec482b84f080947890aad4061a8d44bc0b
        run: |
          curl --fail --location --retry 3 "https://github.com/github/gh-stack/releases/download/v${GH_STACK_VERSION}/linux-amd64" --output /tmp/gh-stack
          echo "${GH_STACK_AMD64_SHA256}  /tmp/gh-stack" | sha256sum --check
          mkdir -p "$HOME/.local/share/gh/extensions/gh-stack"
          install -m 0755 /tmp/gh-stack "$HOME/.local/share/gh/extensions/gh-stack/gh-stack"
      - name: Merge only the tested immutable head through the native stack cascade
        if: env.ALREADY_MERGED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_main="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_main" = "$CURRENT_MAIN"
          # The gate's bottom-open-member assertion holds here, so for this
          # bottom node the all-or-nothing cascade merges exactly one PR. The
          # head-SHA guarantee --match-head-commit used to provide is carried
          # by the pre-merge reverify above, the remote-main equality test
          # here, and the post-merge exact-tree verification below.
          set +e
          gh stack merge "$PR" --squash -y
          status=$?
          set -e
          # gh-stack's documented exit codes, classified so the promotion run
          # log names the failure mode instead of a generic non-zero exit.
          case "$status" in
            0) ;;
            2|6)
              # A stack only exists at two or more pull requests: exit 2 for a
              # single-node candidate means "not in a stack", which is normal —
              # the legacy exact-head merge is correct and documented for a
              # plain pull request. (Exit 6 is number ambiguity; the exact-head
              # match keeps it safe.) Real multi-node stacks never take this
              # branch: their membership was verified by the gate above.
              echo "gh stack merge exit ${status}: single-node candidate (no server-side stack) — merging as a plain pull request with the exact-head match."
              gh pr merge "$PR" --squash --delete-branch --match-head-commit "$EXPECTED_HEAD"
              ;;
            9) echo '::error::gh stack merge exit 9: stacked pull requests are not available — unwinnable, do not re-dispatch.'; exit 9 ;;
            8) echo '::error::gh stack merge exit 8: the stack is locked by another process — back off, then re-dispatch the promotion.'; exit 8 ;;
            4) echo '::error::gh stack merge exit 4: GitHub API failure — retryable; re-dispatch the promotion.'; exit 4 ;;
            3) echo '::error::gh stack merge exit 3: rebase conflict — the candidate needs a restack (next generation, fresh base).'; exit 3 ;;
            7) echo '::error::gh stack merge exit 7: a rebase is already in progress on this stack — wait for it to settle, then re-dispatch.'; exit 7 ;;
            *) echo "::error::gh stack merge failed with unclassified exit ${status}."; exit "$status" ;;
          esac
      - name: Verify exact merged tree and select deployment SHA
        id: verify_merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          remote_main="$(git rev-parse origin/main)"
          if [ "$ALREADY_MERGED" = true ]; then
            test -n "$RECORDED_MERGE_SHA"
            git merge-base --is-ancestor "$RECORDED_MERGE_SHA" "$remote_main"
            deployment_sha="$remote_main"
          else
            merge_sha="$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq '.merge_commit_sha')"
            test -n "$merge_sha"
            test "$remote_main" = "$merge_sha"
            test "$(git rev-list --parents -n 1 "$merge_sha" | wc -w | tr -d ' ')" = 2
            test "$(git rev-parse "${merge_sha}^")" = "$CURRENT_MAIN"
            test "$(git rev-parse "${merge_sha}^{tree}")" = "$EXPECTED_TREE"
            deployment_sha="$merge_sha"
          fi
          git checkout --detach "$deployment_sha"
          git config --local --unset-all http.https://github.com/.extraheader || true
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo 'Checkout credentials remained available before repository scripts.'
            exit 1
          fi
          printf 'deployment_sha=%s\n' "$deployment_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install verified merged-main dependencies without deployment credentials
        run: npm ci
      - name: Revalidate current main during already-merged recovery
        if: env.ALREADY_MERGED == 'true'
        run: npm run check
      - name: Deploy verified current main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_main="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_main" = "${{ steps.verify_merge.outputs.deployment_sha }}"
          npm run deploy
