name: Deploy GitHub App capability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-harness-github-capability-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and verify capability Worker
        run: |
          npm ci
          npm --workspace @app-harness/github-bridge run cf-typegen
          npm --workspace @app-harness/github-bridge run typecheck
      - name: Deploy GitHub App capability Worker
        run: npm --workspace @app-harness/github-bridge exec -- wrangler deploy
