name: Provision runtime secrets

on:
  workflow_dispatch:
    inputs:
      target:
        description: Explicit secret owner to provision or rotate
        required: true
        type: choice
        options:
          - github-capability
          - native-git-runner
          - operator
          - demo
          - platform
          - platform-runner

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APP_HARNESS_GITHUB_APP_ID: ${{ secrets.APP_HARNESS_GITHUB_APP_ID }}
      APP_HARNESS_GITHUB_APP_INSTALLATION_ID: ${{ secrets.APP_HARNESS_GITHUB_APP_INSTALLATION_ID }}
      APP_HARNESS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_HARNESS_GITHUB_APP_PRIVATE_KEY }}
      APP_HARNESS_OPENAI_API_KEY: ${{ secrets.APP_HARNESS_OPENAI_API_KEY }}
      APP_HARNESS_ADMIN_TOKEN: ${{ secrets.APP_HARNESS_ADMIN_TOKEN }}
      APP_HARNESS_PLATFORM_WEBHOOK_SECRET: ${{ secrets.APP_HARNESS_PLATFORM_WEBHOOK_SECRET }}
      APP_HARNESS_ANTHROPIC_API_KEY: ${{ secrets.APP_HARNESS_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Provision GitHub App capability owner
        if: inputs.target == 'github-capability'
        shell: bash
        run: |
          test -n "$APP_HARNESS_GITHUB_APP_ID"
          test -n "$APP_HARNESS_GITHUB_APP_INSTALLATION_ID"
          test -n "$APP_HARNESS_GITHUB_APP_PRIVATE_KEY"
          printf '%s' "$APP_HARNESS_GITHUB_APP_ID" | npm --workspace @app-harness/github-bridge exec -- wrangler secret put GITHUB_APP_ID --name app-harness-os-git-proxy
          printf '%s' "$APP_HARNESS_GITHUB_APP_INSTALLATION_ID" | npm --workspace @app-harness/github-bridge exec -- wrangler secret put GITHUB_APP_INSTALLATION_ID --name app-harness-os-git-proxy
          printf '%s' "$APP_HARNESS_GITHUB_APP_PRIVATE_KEY" | npm --workspace @app-harness/github-bridge exec -- wrangler secret put GITHUB_APP_PRIVATE_KEY --name app-harness-os-git-proxy
      - name: Provision NanoCodex model credential owner
        if: inputs.target == 'native-git-runner'
        shell: bash
        run: |
          test -n "$APP_HARNESS_OPENAI_API_KEY"
          printf '%s' "$APP_HARNESS_OPENAI_API_KEY" | npm --workspace @app-harness/native-git-runner exec -- wrangler secret put OPENAI_API_KEY --name app-harness-os-native-git
      - name: Provision operator model credential owner
        if: inputs.target == 'operator'
        shell: bash
        run: |
          test -n "$APP_HARNESS_OPENAI_API_KEY"
          printf '%s' "$APP_HARNESS_OPENAI_API_KEY" | npm --workspace @app-harness/operator exec -- wrangler secret put MODEL_API_KEY --name app-harness-operator
      - name: Provision demo admin token owner
        if: inputs.target == 'demo'
        shell: bash
        run: |
          test -n "$APP_HARNESS_ADMIN_TOKEN"
          printf '%s' "$APP_HARNESS_ADMIN_TOKEN" | npm --workspace @app-harness/demo exec -- wrangler secret put ADMIN_TOKEN --name autonomous-live-chat
      # The rebuilt platform Worker (phase 3): the SAME repo-level Actions
      # secrets the legacy workers use, plus the platform's own webhook secret
      # (APP_HARNESS_PLATFORM_WEBHOOK_SECRET — distinct from the GitHub App
      # webhook secret the legacy bridge owns) and the optional Doctor
      # credential (APP_HARNESS_ANTHROPIC_API_KEY — skipped when unset; the
      # Doctor then degrades to the deterministic park-for-human stub).
      - name: Provision platform worker secrets
        if: inputs.target == 'platform'
        shell: bash
        run: |
          test -n "$APP_HARNESS_ADMIN_TOKEN"
          test -n "$APP_HARNESS_GITHUB_APP_ID"
          test -n "$APP_HARNESS_GITHUB_APP_INSTALLATION_ID"
          test -n "$APP_HARNESS_GITHUB_APP_PRIVATE_KEY"
          test -n "$APP_HARNESS_PLATFORM_WEBHOOK_SECRET"
          printf '%s' "$APP_HARNESS_ADMIN_TOKEN" | npm --workspace @app-harness/platform exec -- wrangler secret put ADMIN_TOKEN --name app-harness-platform
          printf '%s' "$APP_HARNESS_GITHUB_APP_ID" | npm --workspace @app-harness/platform exec -- wrangler secret put GITHUB_APP_ID --name app-harness-platform
          printf '%s' "$APP_HARNESS_GITHUB_APP_INSTALLATION_ID" | npm --workspace @app-harness/platform exec -- wrangler secret put GITHUB_APP_INSTALLATION_ID --name app-harness-platform
          printf '%s' "$APP_HARNESS_GITHUB_APP_PRIVATE_KEY" | npm --workspace @app-harness/platform exec -- wrangler secret put GITHUB_APP_PRIVATE_KEY --name app-harness-platform
          printf '%s' "$APP_HARNESS_PLATFORM_WEBHOOK_SECRET" | npm --workspace @app-harness/platform exec -- wrangler secret put GITHUB_WEBHOOK_SECRET --name app-harness-platform
          if [ -n "$APP_HARNESS_ANTHROPIC_API_KEY" ]; then
            printf '%s' "$APP_HARNESS_ANTHROPIC_API_KEY" | npm --workspace @app-harness/platform exec -- wrangler secret put ANTHROPIC_API_KEY --name app-harness-platform
          else
            echo "APP_HARNESS_ANTHROPIC_API_KEY is unset; the Doctor stays on the deterministic stub."
          fi
      - name: Provision platform runner model credential
        if: inputs.target == 'platform-runner'
        shell: bash
        run: |
          test -n "$APP_HARNESS_OPENAI_API_KEY"
          printf '%s' "$APP_HARNESS_OPENAI_API_KEY" | npm --workspace @app-harness/platform-runner exec -- wrangler secret put OPENAI_API_KEY --name app-harness-platform-runner
