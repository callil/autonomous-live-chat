name: Provision runtime secrets

on:
  workflow_dispatch:
    inputs:
      target:
        description: Explicit secret owner to provision or rotate
        required: true
        type: choice
        options:
          - github-capability
          - native-git-runner

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APP_HARNESS_GITHUB_APP_ID: ${{ secrets.APP_HARNESS_GITHUB_APP_ID }}
      APP_HARNESS_GITHUB_APP_INSTALLATION_ID: ${{ secrets.APP_HARNESS_GITHUB_APP_INSTALLATION_ID }}
      APP_HARNESS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.APP_HARNESS_GITHUB_APP_PRIVATE_KEY }}
      APP_HARNESS_OPENAI_API_KEY: ${{ secrets.APP_HARNESS_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Provision GitHub App capability owner
        if: inputs.target == 'github-capability'
        shell: bash
        run: |
          test -n "$APP_HARNESS_GITHUB_APP_ID"
          test -n "$APP_HARNESS_GITHUB_APP_INSTALLATION_ID"
          test -n "$APP_HARNESS_GITHUB_APP_PRIVATE_KEY"
          printf '%s' "$APP_HARNESS_GITHUB_APP_ID" | npm --workspace @app-harness/github-bridge exec -- wrangler secret put GITHUB_APP_ID --name app-harness-os-git-proxy
          printf '%s' "$APP_HARNESS_GITHUB_APP_INSTALLATION_ID" | npm --workspace @app-harness/github-bridge exec -- wrangler secret put GITHUB_APP_INSTALLATION_ID --name app-harness-os-git-proxy
          printf '%s' "$APP_HARNESS_GITHUB_APP_PRIVATE_KEY" | npm --workspace @app-harness/github-bridge exec -- wrangler secret put GITHUB_APP_PRIVATE_KEY --name app-harness-os-git-proxy
      - name: Provision NanoCodex model credential owner
        if: inputs.target == 'native-git-runner'
        shell: bash
        run: |
          test -n "$APP_HARNESS_OPENAI_API_KEY"
          printf '%s' "$APP_HARNESS_OPENAI_API_KEY" | npm --workspace @app-harness/native-git-runner exec -- wrangler secret put OPENAI_API_KEY --name app-harness-os-native-git
