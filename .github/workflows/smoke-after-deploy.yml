name: Smoke after deploy
run-name: Smoke · ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}

# THE LAYER THAT CATCHES A BROKEN DEPLOY.
#
# Pre-merge CI runs against the working tree. It cannot see a deploy that did
# not land, a worker binding that is not wired, a stale asset, or a platform
# and product that disagree about what revision is live. That gap is how a
# green pipeline coexisted with a broken room, twice.
#
# So this runs POST-DEPLOY, never pre-merge: it is a detector, not a gate. It
# must never be able to block a merge, and it must be loud when it trips.
on:
  workflow_run:
    workflows: ["Deploy product", "Deploy platform"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Revision the deployment is expected to be serving. Empty skips the revision match."
        required: false
        default: ""
      url:
        description: "Origin to smoke. Empty uses the default product origin."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: app-harness-smoke
  cancel-in-progress: true

jobs:
  smoke:
    # A deploy that failed is already red; smoking it would only add noise.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Smoke the checks as they exist at the revision that was deployed,
          # with history so the product-diff test below can be computed.
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # /version is served by the PRODUCT worker, and the product worker only
      # redeploys on a product/** change. So the revision match is meaningful
      # exactly when this merge touched product/ — asserting it after a
      # platform-only deploy compares the product's revision against a SHA it
      # was never going to serve, which is a guaranteed false failure. That is
      # not a hypothetical: it is what this job did on its first platform-only
      # merge, with all eight substantive checks passing.
      #
      # Everything else the job checks — the page, both deployed scripts, the
      # send control, a live session — still runs either way, because a
      # platform deploy absolutely can break them.
      - name: Decide whether the product revision is expected to have moved
        id: scope
        env:
          REVISION: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
        run: |
          set -uo pipefail
          if ! changed="$(git diff --name-only "${REVISION}~1" "${REVISION}" 2>/dev/null)"; then
            echo "expect_sha=" >> "$GITHUB_OUTPUT"
            echo "Could not compute the diff; not asserting the revision."
            exit 0
          fi
          if echo "$changed" | grep -q '^product/'; then
            echo "expect_sha=${REVISION}" >> "$GITHUB_OUTPUT"
            echo "This merge touched product/; the live revision must become ${REVISION}."
          else
            echo "expect_sha=" >> "$GITHUB_OUTPUT"
            echo "No product/ change; the product worker keeps its current revision by design."
          fi

      # The smoke checks are dependency-free by design: they use Node's own
      # fetch and the repo's DOM harness, so there is nothing to install and
      # nothing that can rot between a deploy and its verification.
      #
      # There is deliberately no "wait for propagation" step here. A shell loop
      # that polls until the revision appears, and then hands off to a separate
      # process that samples it again, still races: a Workers deploy does not
      # flip every edge colo at the same instant, so the two samples can
      # disagree. That produced a red smoke job over a perfectly good deploy on
      # the very first run. The waiting belongs inside the check that cares
      # about the revision, where the retry and the assertion see the same
      # samples — so it lives in smoke.mjs.
      - name: Smoke the live deployment
        id: smoke
        env:
          SMOKE_URL: ${{ inputs.url || 'https://app-harness-product.coda-a.workers.dev' }}
          SMOKE_SHA: ${{ steps.scope.outputs.expect_sha }}
        run: npm run smoke

      # Loud on purpose. A broken deploy that only shows up as a grey X on a
      # workflow nobody opens is the same outage as no test at all.
      - name: Announce a broken deployment
        if: ${{ failure() }}
        env:
          SMOKE_URL: ${{ inputs.url || 'https://app-harness-product.coda-a.workers.dev' }}
          REVISION: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## The live deployment is broken"
            echo
            echo "\`${SMOKE_URL}\` failed its post-deploy smoke checks at revision \`${REVISION}\`."
            echo
            echo "This is not a flaky pre-merge test — the checks ran against the real origin,"
            echo "so the room is broken for users right now. Read the failing check above:"
            echo "it names which of page / version / client / overlay / session is down."
            echo
            echo "Run it locally against the same origin with:"
            echo
            echo '```'
            echo "npm run smoke -- --url ${SMOKE_URL}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Live deployment is broken::${SMOKE_URL} failed post-deploy smoke at ${REVISION}. See ${RUN_URL}"
