name: App Harness CI

on:
  pull_request:
  push:
    branches: [main]
    # CI diet: a push to main is a squash merge of a PR whose verify run
    # already passed on the same tree. Only CI/manifest changes re-run the
    # suite here; platform and product pushes ride their own deploy workflows,
    # which run the relevant gates themselves.
    paths:
      - ".github/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-harness-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      # Scope detection, not a scope CHOICE: the full suite is the default and
      # the narrow lane is entered only when the diff is provably confined to
      # product/. Anything else — platform, CI, manifests, lockfiles, or
      # a diff this step cannot compute — falls through to the full suite. The
      # merge authority is unchanged; this only stops a product CSS tweak from
      # typechecking every Worker and running the whole monorepo to prove it.
      - name: Decide how much of the suite this diff requires
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"; then
            echo "product_only=false" >> "$GITHUB_OUTPUT"
            echo "Could not compute the diff; running the full suite."
            exit 0
          fi
          if [ -z "$changed" ]; then
            echo "product_only=false" >> "$GITHUB_OUTPUT"
            echo "Empty diff; running the full suite."
            exit 0
          fi
          product_only=true
          while IFS= read -r file; do
            case "$file" in
              product/*) ;;
              *) product_only=false ;;
            esac
          done <<< "$changed"
          echo "product_only=$product_only" >> "$GITHUB_OUTPUT"
          echo "product-only diff: $product_only"
          printf ' - %s\n' $changed
      # The product lane runs the BOOT layer as well as the product's own tests.
      # It is the lane an agent change actually goes through, and boot tests are
      # the ones that execute the shipped client and overlay scripts — the layer
      # that catches a room that renders but never connects. They cost a few
      # hundred milliseconds, so there is no reason to defer them to the full
      # suite: a product diff can break the overlay's host page just as easily.
      - name: Verify the product surface and that both clients still boot (product-only diff)
        if: ${{ steps.scope.outputs.product_only == 'true' }}
        run: |
          npm --workspace @app-harness/product run cf-typegen
          npm --workspace @app-harness/product run typecheck
          npm --workspace @app-harness/product test
          node --test platform/test/overlay-boot.test.mjs
          git diff --check
      - name: Verify Worker, orchestration, stack, and agent contracts
        if: ${{ steps.scope.outputs.product_only != 'true' }}
        run: npm run check
