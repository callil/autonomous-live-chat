name: App Harness CI

on:
  pull_request:
  push:
    branches: [main]
    # CI diet: a push to main is a squash merge of a PR whose verify run (or
    # the candidate validator, for agent candidates) already passed on the same
    # tree. Only platform-surface changes re-run the heavy suite here; pure
    # apps/demo and docs pushes skip it — the deploy workflow still deploys.
    paths:
      - "packages/**"
      - "infra/**"
      - ".github/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-harness-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Agent candidate branches are validated by the trusted candidate workflow
    # against their immutable head; running the same baseline here again would
    # only duplicate it.
    if: ${{ !startsWith(github.event.pull_request.head.ref || '', 'app-harness-os/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify Worker, orchestration, stack, and agent contracts
        run: npm run check
