name: Validate App Harness OS candidate
run-name: App Harness candidate · PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.head.sha }}

on:
  # GitHub evaluates this workflow from the protected default branch. Candidate
  # code is checked out only by the unprivileged validation job below.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions: {}

concurrency:
  group: app-harness-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  provenance:
    if: startsWith(github.event.pull_request.head.ref || '', 'app-harness-os/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull_request: ${{ steps.candidate.outputs.pull_request }}
      head_sha: ${{ steps.candidate.outputs.head_sha }}
      candidate_base_sha: ${{ steps.candidate.outputs.candidate_base_sha }}
      ci_profile: ${{ steps.candidate.outputs.ci_profile }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out trusted verifier from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Verify trusted candidate provenance and scope
        id: candidate
        run: node infra/scripts/os-stack-gate.mjs verify-pr

  validate_candidate:
    name: validate-candidate
    needs: provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_HARNESS_EXPECTED_BASE: ${{ needs.provenance.outputs.candidate_base_sha }}
      APP_HARNESS_EXPECTED_HEAD: ${{ needs.provenance.outputs.head_sha }}
    steps:
      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.provenance.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm immutable checkout and credential isolation
        run: |
          test "$(git rev-parse HEAD)" = "$APP_HARNESS_EXPECTED_HEAD"
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo 'Checkout credentials remained available to candidate code.'
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install candidate dependencies without privileged secrets
        run: npm ci
      # CI diet: the gate-parsed, ledger-declared CI profile classifies the
      # candidate's validation cost. Content and visual candidates touch only
      # the demo surface, so they run the demo composer test plus the demo
      # typecheck; every other profile (or an absent marker) runs the full
      # workspace baseline. The required validate-candidate check reports
      # either way — the fast path narrows the steps, never the gate.
      - name: Run mandatory candidate baseline
        if: ${{ needs.provenance.outputs.ci_profile != 'content' && needs.provenance.outputs.ci_profile != 'visual' }}
        run: npm run check
      - name: Run scoped content/visual candidate baseline
        if: ${{ needs.provenance.outputs.ci_profile == 'content' || needs.provenance.outputs.ci_profile == 'visual' }}
        run: |
          npm --workspace @app-harness/demo run cf-typegen
          npm --workspace @app-harness/demo run typecheck
          node apps/demo/test/composer.test.mjs
