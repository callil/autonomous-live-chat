name: Validate App Harness OS stack node

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: app-harness-stack-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  validate-node:
    if: startsWith(github.event.pull_request.head.ref, 'app-harness-os/')
    runs-on: ubuntu-latest
    steps:
      - name: Verify orchestrator-owned stack relationship
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const pr = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")).pull_request;
            const headRefName = pr.head.ref;
            const baseRefName = pr.base.ref;
            const baseSha = pr.base.sha;
            if (!/^app-harness-os\/\d+\/g\d+$/.test(headRefName)) throw new Error("PR head is outside the OS stack namespace");
            if (!(baseRefName === "main" || /^app-harness-os\/\d+\/g\d+$/.test(baseRefName))) throw new Error("PR base is not main or an immediate OS stack parent");
            fs.appendFileSync(process.env.GITHUB_ENV, `APP_HARNESS_EXPECTED_BASE=${baseSha}\n`);
          '
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mandatory baseline
        run: |
          npm run cf-typegen
          npx tsc --noEmit
          npm run test:stack
          npm run test:native-git-preflight
          npm run test:os-provider-bridge
          git diff --check
      - name: Visual CI profile (scoped static safeguard)
        run: node scripts/check-visual-candidate.mjs
      - name: Publish validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' \
            '<!-- app-harness-os-ci:${{ github.run_id }} -->' \
            'App Harness OS stack-node validation passed: the repository baseline gates plus the scoped visual-token/reduced-motion static check.' \
            'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            > /tmp/app-harness-os-ci.md
          gh pr comment "$PR" --body-file /tmp/app-harness-os-ci.md
