name: Validate App Harness OS candidate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Existing App Harness OS pull request to validate
        required: true
        type: string

permissions: {}

concurrency:
  group: app-harness-candidate-${{ inputs.pull_request || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  provenance:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref || '', 'app-harness-os/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      pull_request: ${{ steps.candidate.outputs.pull_request }}
      head_sha: ${{ steps.candidate.outputs.head_sha }}
      candidate_base_sha: ${{ steps.candidate.outputs.candidate_base_sha }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pull_request || github.event.pull_request.number }}
    steps:
      - name: Check out trusted verifier from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Verify trusted one-node candidate provenance and scope
        id: candidate
        env:
          EXPECTED_PARENT: main
        run: node scripts/os-stack-gate.mjs verify-pr
      - name: Publish signed pending status before candidate execution
        env:
          ATTESTATION_SECRET: ${{ secrets.AUTONOMY_CALLBACK_SECRET }}
          EXPECTED_BASE: ${{ steps.candidate.outputs.candidate_base_sha }}
          EXPECTED_HEAD: ${{ steps.candidate.outputs.head_sha }}
          PR: ${{ steps.candidate.outputs.pull_request }}
          VALIDATION_STATE: pending
        run: node scripts/os-stack-gate.mjs publish-status

  validate_candidate:
    name: validate-candidate
    needs: provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_HARNESS_EXPECTED_BASE: ${{ needs.provenance.outputs.candidate_base_sha }}
      APP_HARNESS_EXPECTED_HEAD: ${{ needs.provenance.outputs.head_sha }}
    steps:
      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.provenance.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm immutable checkout and credential isolation
        run: |
          test "$(git rev-parse HEAD)" = "$APP_HARNESS_EXPECTED_HEAD"
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo 'Checkout credentials remained available to candidate code.'
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install candidate dependencies without privileged secrets
        run: npm ci
      - name: Run mandatory candidate baseline
        run: |
          npm run cf-typegen
          npx tsc --noEmit
          npm run test:stack
          npm run test:native-git-preflight
          npm run test:os-provider-bridge
          git diff --check
      - name: Recheck the scoped visual contract
        run: node scripts/check-visual-candidate.mjs

  publish_validation:
    name: publish-validation
    needs: [provenance, validate_candidate]
    if: always() && needs.provenance.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.provenance.outputs.pull_request }}
      EXPECTED_BASE: ${{ needs.provenance.outputs.candidate_base_sha }}
      EXPECTED_HEAD: ${{ needs.provenance.outputs.head_sha }}
      ATTESTATION_SECRET: ${{ secrets.AUTONOMY_CALLBACK_SECRET }}
    steps:
      - name: Check out trusted publisher from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Publish signed immutable validation result
        env:
          VALIDATION_STATE: ${{ needs.validate_candidate.result == 'success' && 'success' || 'failure' }}
        run: node scripts/os-stack-gate.mjs publish-status
      - name: Comment with successful validation evidence
        if: needs.validate_candidate.result == 'success'
        continue-on-error: true
        run: |
          printf '%s\n' \
            '<!-- app-harness-os-ci:${{ github.run_id }} -->' \
            "App Harness OS one-node candidate validation passed for ${{ needs.provenance.outputs.head_sha }}." \
            'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            > /tmp/app-harness-os-ci.md
          gh pr comment "$PR" --body-file /tmp/app-harness-os-ci.md
