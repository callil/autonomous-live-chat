name: Validate App Harness OS stack node

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Existing App Harness OS pull request to validate
        required: true
        type: string

permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

concurrency:
  group: app-harness-stack-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  validate-node:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.head.ref || '', 'app-harness-os/')
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pull_request || github.event.pull_request.number }}
    steps:
      - name: Verify orchestrator-owned stack relationship
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const pr = JSON.parse(execFileSync("gh", ["api", `repos/${process.env.GH_REPO}/pulls/${process.env.PR}`], { encoding: "utf8" }));
            const headRefName = pr.head.ref;
            const baseRefName = pr.base.ref;
            const baseSha = pr.base.sha;
            if (!/^app-harness-os\/\d+\/g\d+$/.test(headRefName)) throw new Error("PR head is outside the OS stack namespace");
            if (!(baseRefName === "main" || /^app-harness-os\/\d+\/g\d+$/.test(baseRefName))) throw new Error("PR base is not main or an immediate OS stack parent");
            fs.appendFileSync(process.env.GITHUB_ENV, `APP_HARNESS_EXPECTED_BASE=${baseSha}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `APP_HARNESS_EXPECTED_HEAD=${pr.head.sha}\n`);
          '
      - uses: actions/checkout@v4
        with:
          # Node validation is against the candidate itself. Promotion later
          # validates the synthetic merge ref as the current stack tip.
          ref: refs/pull/${{ inputs.pull_request || github.event.pull_request.number }}/head
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mandatory baseline
        run: |
          npm run cf-typegen
          npx tsc --noEmit
          npm run test:stack
          npm run test:native-git-preflight
          npm run test:os-provider-bridge
          git diff --check
      - name: Visual CI profile (scoped static safeguard)
        run: |
          test "$(git rev-parse HEAD)" = "$APP_HARNESS_EXPECTED_HEAD"
          node scripts/check-visual-candidate.mjs
      - name: Publish validation evidence
        run: |
          printf '%s\n' \
            '<!-- app-harness-os-ci:${{ github.run_id }} -->' \
            'App Harness OS stack-node validation passed: the repository baseline gates plus the scoped visual-token/reduced-motion static check.' \
            'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            > /tmp/app-harness-os-ci.md
          gh pr comment "$PR" --body-file /tmp/app-harness-os-ci.md
      - name: Publish immutable candidate validation status
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync("/tmp/app-harness-os-status.json", JSON.stringify({
            state: "success",
            context: "app-harness-os/validate-node",
            description: "Baseline and scoped visual safeguards passed.",
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GH_REPO}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          gh api --method POST "repos/${GH_REPO}/statuses/${APP_HARNESS_EXPECTED_HEAD}" --input /tmp/app-harness-os-status.json > /tmp/app-harness-os-status-response.json
      - name: Publish failed immutable candidate validation status
        if: failure() && env.APP_HARNESS_EXPECTED_HEAD != ''
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync("/tmp/app-harness-os-status.json", JSON.stringify({
            state: "failure",
            context: "app-harness-os/validate-node",
            description: "Validation failed; promotion remains blocked.",
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GH_REPO}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          gh api --method POST "repos/${GH_REPO}/statuses/${APP_HARNESS_EXPECTED_HEAD}" --input /tmp/app-harness-os-status.json > /tmp/app-harness-os-status-response.json
