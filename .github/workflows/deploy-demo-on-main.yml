name: Deploy demo on main
run-name: App Harness main deploy · ${{ github.sha }}

# The auto-merge fast lane's deploy leg: every push to main that touches the
# demo app or shared packages deploys exactly that revision, the same way the
# trusted promotion workflow's deploy step does. os-stack-promote.yml remains
# untouched as the fallback promotion-and-deploy path.
on:
  push:
    branches: [main]
    paths:
      - "apps/demo/**"
      - "packages/**"
  workflow_dispatch:
    inputs:
      sha:
        description: >
          Exact commit to deploy. Must be reachable from main (the ancestor
          check below enforces this). The platform reconciler dispatches this
          after each squash merge, and again with a PRIOR good SHA to execute
          a revert. Empty means the current main head.
        required: false
        default: ""

permissions: {}

# Every main mutation and production deployment shares one lock with the
# promotion workflow, so the fast lane can never race a promotion deploy.
concurrency:
  group: app-harness-main-promotion-and-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      DEPLOY_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the deployed revision to still be reachable from main
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          remote_main="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$DEPLOY_SHA" "$remote_main"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact merged-main dependencies without deployment credentials
        run: npm ci
      # DEPLOY_SHA is injected as a Worker var so the product's /version
      # endpoint serves the exact deployed revision — the platform's observed
      # deploy ("Live" posts only when /version serves the merged SHA) and the
      # liveness watchdog both read it.
      - name: Deploy the verified revision with its SHA stamped into /version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm --workspace @app-harness/demo run deploy -- --var "DEPLOY_SHA:$DEPLOY_SHA"
